<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vivek Vikram Singh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Vivek Vikram Singh, product designer for enterprise AI: agents, copilots and the governance around them.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a studio portfolio on a soft grey ground with a faint 12-column grid; full-bleed mock-ups, big tight Inter, serif italics for the human voice, a dark closing band. Single deliberate light theme. */
:root{
  --ground:#EEEEEE; --ink:#131313; --ink2:rgba(19,19,19,.68); --ink3:rgba(19,19,19,.60); --rule:rgba(19,19,19,.14); --panel:#E3E3E3; --paper:#F7F7F7;
  --night:#131313; --night-ink:#F2F2F2; --night-ink2:rgba(242,242,242,.55);
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --pad:max(20px,env(safe-area-inset-left,0px));
  --ease:cubic-bezier(.22,.61,.24,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;font-weight:500;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.it{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.003em}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:max(70px,env(safe-area-inset-left,0px));padding-right:max(70px,env(safe-area-inset-right,0px))}}
/* faint column grid */
.cols{position:fixed;inset:0;pointer-events:none;z-index:0}
.cols .wrap{height:100%;display:grid;grid-template-columns:repeat(12,1fr)}
.cols span{border-left:1px dashed rgba(19,19,19,.045);height:100%}
@media (max-width:899px){.cols{display:none}}
main,header,footer{position:relative;z-index:1}

/* header */
.top{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);z-index:40;color:var(--ink);border-bottom:1px solid transparent}
:root{--navh:60px}
@media (max-width:899px){:root{--navh:52px}}
.top .wrap{transition:padding .35s var(--ease)}
.top.stuck{background:color-mix(in srgb,var(--ground) 86%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom-color:var(--rule)}
.top.stuck .wrap{padding-top:18px!important;padding-bottom:18px}
@media (max-width:899px){.top.stuck .wrap{padding-top:15px!important;padding-bottom:15px}}
.top.on-dark{color:#fff}
.top .wrap{display:grid;grid-template-columns:repeat(12,1fr);gap:0 16px;padding-top:36px}
.logo{grid-column:1/5;font-size:22px;letter-spacing:-.014em;align-self:start;line-height:1.2}
.ncol{display:grid;gap:4px;font-size:14px;letter-spacing:-.021em;align-content:start;line-height:1.2}
.ncol.a{grid-column:6/8}.ncol.b{grid-column:8/11}.ncol.c{grid-column:11/13;justify-items:end}
.roll{display:inline-block;overflow:hidden;height:1.2em;vertical-align:top}
.roll span{display:block;transition:transform .45s var(--ease)}
.roll span+span{opacity:.6}
a:hover .roll span,a:focus-visible .roll span{transform:translateY(-100%)}
@media (max-width:899px){.top .wrap{grid-template-columns:1fr auto;padding-top:22px}.logo{grid-column:1}.ncol.b,.ncol.c{display:none}.ncol.a{grid-column:2;grid-auto-flow:column;gap:16px}.top .ncol.a a:nth-child(3),.top .ncol.a a:nth-child(4){display:none}}

/* hero */
.hero{position:relative;overflow:hidden;background:#221f1c;color:#fff}
.hero>.brain{position:relative;display:block;width:100%;aspect-ratio:1.75;object-fit:cover;object-position:50% 50%;margin-top:calc(-1*clamp(24px,6vw,110px));-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%);mask-image:linear-gradient(180deg,transparent 0,#000 18%);will-change:transform}
.hero .wrap{position:relative;padding-top:clamp(130px,11.5vw,180px);padding-bottom:0}
.hl{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.hl h1{font-size:clamp(44px,6.2vw,96px);line-height:1.05;letter-spacing:-.023em;font-weight:500}
.hl h1 .it{font-size:1.06em;letter-spacing:-.01em}
.mask{display:block;overflow:hidden;padding-bottom:.06em}
.mask>span{display:inline-block;animation:rise 1.1s var(--ease) both}
.mask.d2>span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(55%)}to{transform:none}}
.hb{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-top:clamp(20px,2.4vw,36px);font-size:15px;line-height:1.35;color:rgba(255,255,255,.66);letter-spacing:-.014em}
.hb b{color:#fff;font-weight:500}
.hb .r{text-align:right}
@media (max-width:899px){.hero>.brain{aspect-ratio:1.1;object-position:50% 60%;margin-top:-8px}.hl{flex-direction:column;justify-content:flex-start;gap:0}.hb .r{display:none}.logo{font-size:18px}.ncol.a{gap:12px}}

/* sections */
.sec{padding-block:140px 0}
.sec.tight{padding-top:96px}
.row12{display:grid;grid-template-columns:repeat(12,1fr);gap:0 16px}
.lbl{font-size:30px;letter-spacing:-.014em;line-height:1.1;color:var(--ink)}
.lbl small{display:block;font-size:13px;letter-spacing:-.007em;color:var(--ink3);margin-bottom:6px}
.stmt{font-size:clamp(26px,2.8vw,40px);line-height:1.12;letter-spacing:-.021em;text-align:left;text-wrap:pretty}
.stmt.l{text-align:left}
.stmt .g{color:var(--ink3)}
.about .lbl{grid-column:1/5}.about .body{grid-column:7/13;display:grid;gap:28px}
@media (max-width:899px){.row12{grid-template-columns:1fr}.about .lbl,.about .body{grid-column:1}.about .body{margin-top:20px}.stmt{text-align:left}}
.btn{display:inline-flex;align-items:center;gap:10px;justify-self:end;background:var(--ink);color:#fff;font:inherit;font-size:17px;letter-spacing:-.017em;padding:16px 24px;border:0;cursor:pointer;transition:background .3s}
.btn:hover{background:#000}
.btn svg{width:14px;height:14px;transition:transform .4s var(--ease)}
.btn:hover svg{transform:translateX(4px)}

/* gallery strip */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:120px;align-items:start}
.strip .c{display:grid;gap:16px;will-change:transform}
.strip .c:nth-child(even){margin-top:64px}
.strip img{width:100%;object-fit:cover;background:var(--panel)}
@media (max-width:899px){.strip{grid-template-columns:repeat(2,1fr)}.strip .c:nth-child(n+3){display:none}}

/* expertise */
.svc-head{display:grid;gap:14px;max-width:760px}
.svc{margin-top:56px;border-top:1px solid transparent}
.svc button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:end;width:100%;padding:28px 16px 22px;border-bottom:1px solid var(--rule);color:var(--ink2);transition:color .35s,padding .5s var(--ease)}
.svc button span:first-child{font-size:clamp(34px,4.6vw,64px);letter-spacing:-.016em;font-weight:400;line-height:1.05}
.svc button span:last-child{font-size:13px;color:var(--ink3);letter-spacing:-.007em;padding-bottom:10px}
.svc button:hover,.svc button:focus-visible,.svc button[aria-pressed="true"]{color:var(--ink);padding-left:28px}
.svc button[aria-pressed="true"] span:first-child::after{content:" ●";font-size:.3em;vertical-align:middle;color:var(--ink)}

/* work */
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 16px;margin-top:56px}
@media (max-width:760px){.works{grid-template-columns:1fr;gap:40px}}
.wk{display:grid;gap:12px;align-content:start;min-width:0}
.wk .im{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--panel)}
.wk .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.wk:hover .im img{transform:scale(1.035)}
.wk .t{font-size:20px;letter-spacing:-.017em;line-height:1.2;display:flex;justify-content:space-between;gap:16px}
.wk .t em{font-style:normal;color:var(--ink3);font-size:14px;letter-spacing:-.007em;padding-top:4px;white-space:nowrap}
.wk .c{font-size:20px;letter-spacing:-.017em;line-height:1.2;color:var(--ink2);margin-top:-8px}
.wk .tag{position:absolute;left:16px;top:16px;font-size:12px;letter-spacing:-.003em;padding:6px 10px;background:rgba(247,247,247,.9);color:var(--ink)}
.filt{display:flex;gap:14px;align-items:baseline;margin-top:28px;font-size:15px;color:var(--ink2)}
.filt button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:120px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.sub-h h3{font-size:30px;letter-spacing:-.016em;font-weight:500}
.sub-h span{font-size:14px;color:var(--ink3);letter-spacing:-.007em}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 16px;margin-top:32px}
.more .im{aspect-ratio:16/10}
.more .t,.more .c{font-size:17px}
.craft{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px;margin-top:32px}
.craft .im{aspect-ratio:1}
.craft .t,.craft .c{font-size:16px}
@media (max-width:899px){.more{grid-template-columns:1fr 1fr}.craft{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.more{grid-template-columns:1fr}}

/* approach */
.ap .lbl{grid-column:1/5}.ap .body{grid-column:6/13}
@media (max-width:899px){.ap .lbl,.ap .body{grid-column:1}.ap .body{margin-top:20px}}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px;margin-top:64px}
@media (max-width:760px){.trio{grid-template-columns:1fr}}
.trio div{border-top:1px solid var(--ink);padding-top:16px;display:grid;gap:10px;align-content:start}
.trio h4{font-size:20px;letter-spacing:-.017em;font-weight:500}
.trio p{font-size:15px;color:var(--ink2);letter-spacing:-.007em;line-height:1.5;font-weight:400}
.facts{margin-top:72px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}}
.facts div{display:grid;gap:4px;border-top:1px solid var(--rule);padding-top:14px}
.facts dt{font-size:13px;color:var(--ink3);letter-spacing:-.007em}
.facts dd{font-size:17px;letter-spacing:-.014em;line-height:1.3}
.tools{margin-top:56px;display:grid;gap:0}
.tools div{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--rule);font-size:15px;letter-spacing:-.007em;font-weight:400}
.tools div:last-child{border-bottom:1px solid var(--rule)}
.tools dt{color:var(--ink3);font-weight:500}
@media (max-width:640px){.tools div{grid-template-columns:1fr;gap:2px}}

/* footer */
.foot{background:var(--night);color:var(--night-ink);margin-top:160px;padding-block:96px 0;overflow:hidden}
.foot .row12{align-items:start}
.foot .cta{grid-column:1/7;display:grid;gap:22px}
.foot .cta h2{font-size:clamp(30px,3vw,42px);letter-spacing:-.019em;font-weight:500}
.mail{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:18px;letter-spacing:-.01em}
.mail span{user-select:all;color:var(--night-ink)}
.mail button{all:unset;cursor:pointer;font-size:14px;color:var(--night-ink2);border-bottom:1px solid currentColor}
.mail button:hover{color:var(--night-ink)}
.foot .cta p{font-size:14px;color:var(--night-ink2);letter-spacing:-.007em}
.foot .ncol{font-size:14px;color:var(--night-ink)}
.foot .ncol.a{grid-column:8/10}.foot .ncol.b{grid-column:10/12}.foot .ncol.c{grid-column:12/13;justify-items:end}
@media (max-width:899px){.foot .cta,.foot .ncol.a,.foot .ncol.b,.foot .ncol.c{grid-column:1;justify-items:start}.foot .ncol{margin-top:32px}.foot .ncol.c{display:none}}
.giant{font-size:clamp(64px,14.6vw,220px);letter-spacing:-.025em;line-height:.8;color:#5C5C5C;white-space:nowrap;margin-top:96px;font-weight:400;transition:color .6s}
.giant:hover{color:#8a8a8a}
.copy{display:flex;justify-content:space-between;gap:16px;padding-block:28px 36px;font-size:13px;color:var(--night-ink2);letter-spacing:-.007em}

/* case study */
.cs{padding-top:clamp(150px,13vw,190px)}
.crumb{font-size:15px;letter-spacing:-.014em;color:var(--ink2)}
.crumb a{color:var(--ink)}
.crumb i{display:inline-block;width:1px;height:12px;background:var(--ink3);margin:0 10px;vertical-align:-1px}
.cs h1{font-size:clamp(48px,6.4vw,96px);letter-spacing:-.023em;line-height:1;font-weight:500;margin-top:14px}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(26px,2.7vw,38px);line-height:1.15;letter-spacing:-.003em;color:var(--ink2);margin-top:14px;max-width:30ch;font-weight:400}
.cs .lede{margin-top:40px;max-width:900px}
.cmeta{display:grid;grid-template-columns:repeat(12,1fr);gap:24px 16px;margin-top:48px;align-items:end}
.cmeta dl{grid-column:1/10;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 24px}
.cmeta dl div{display:grid;gap:3px;align-content:start}
.cmeta dt{font-size:14px;color:var(--ink3);letter-spacing:-.01em}
.cmeta dd{font-size:15px;letter-spacing:-.01em;line-height:1.35}
.cmeta .btn{grid-column:10/13}
@media (max-width:899px){.cmeta dl{grid-column:1/-1;grid-template-columns:1fr 1fr}.cmeta .btn{grid-column:1/-1;justify-self:start}}
.nda{margin-top:28px;font-size:14px;color:var(--ink2);letter-spacing:-.007em;font-weight:400;max-width:70ch;padding-left:14px;border-left:2px solid var(--ink)}
.chero{margin-top:56px;overflow:hidden;background:var(--panel);aspect-ratio:2400/1350}
.chero img{width:100%;height:100%;object-fit:cover;will-change:transform}
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px;margin-top:72px}
@media (max-width:760px){.ov{grid-template-columns:1fr}}
.ov div{display:grid;gap:12px;align-content:start}
.ov h4{font-size:26px;letter-spacing:-.014em;font-weight:500}
.ov p{font-size:16px;color:var(--ink2);letter-spacing:-.007em;font-weight:400;line-height:1.5}
.csec{margin-top:160px;scroll-margin-top:calc(var(--navh) + 24px)}
.csec-h{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;padding-top:20px;border-top:1px solid var(--ink)}
.csec-h .lbl{grid-column:1/6}
.csec-h .stmt{grid-column:6/13}
@media (max-width:899px){.csec-h{grid-template-columns:1fr}.csec-h .lbl,.csec-h .stmt{grid-column:1}}
.flow{display:grid;grid-template-columns:repeat(12,1fr);gap:0 16px}
.flow>*{grid-column:6/13;min-width:0}
.flow>.full{grid-column:1/-1}
@media (max-width:899px){.flow>*{grid-column:1/-1}}
.b-h3{font-size:30px;letter-spacing:-.017em;line-height:1.1;margin-top:96px;font-weight:500;scroll-margin-top:calc(var(--navh) + 24px)}
.b-h3.full{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,1fr);gap:16px;padding-top:16px;border-top:1px solid var(--rule)}
.b-h3.full span{grid-column:6/13}
.b-h3.full small{grid-column:1/6;font-size:14px;color:var(--ink3);letter-spacing:-.007em;font-weight:500;padding-top:8px}
@media (max-width:899px){.b-h3.full{grid-template-columns:1fr}.b-h3.full span,.b-h3.full small{grid-column:1}}
.b-h4{font-size:20px;letter-spacing:-.014em;margin-top:48px;font-weight:500}
.b-p{margin-top:20px;font-size:17px;line-height:1.55;letter-spacing:-.007em;font-weight:400;color:rgba(19,19,19,.82);max-width:66ch}
.b-ul{margin-top:18px;padding-left:20px;display:grid;gap:8px;font-size:17px;line-height:1.5;letter-spacing:-.007em;font-weight:400;color:rgba(19,19,19,.82);max-width:66ch}
.b-ul li::marker{color:var(--ink3)}
.b-q{margin:40px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(28px,2.6vw,38px);line-height:1.15;letter-spacing:-.003em;font-weight:400}
.b-q small{display:block;font-family:var(--sans);font-style:normal;font-size:13px;letter-spacing:-.007em;color:var(--ink3);margin-bottom:10px;font-weight:500}
.b-note{margin-top:10px;font-size:13px;color:var(--ink3);letter-spacing:-.007em;font-weight:400}
.b-tbl{margin-top:28px;overflow-x:auto}
.b-tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;letter-spacing:-.007em}
.b-tbl th{font-weight:500;color:var(--ink3);text-align:left;font-size:13px;padding:0 18px 12px 0;border-bottom:1px solid var(--ink)}
.b-tbl td{padding:14px 18px 14px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-weight:400;color:rgba(19,19,19,.82)}
.b-tbl td:first-child{font-weight:500;color:var(--ink)}
@media (max-width:560px){
 .b-tbl{overflow:visible}
 .b-tbl table{min-width:0;display:block}
 .b-tbl thead{display:none}
 .b-tbl tbody{display:block}
 .b-tbl tbody[hidden]{display:none}
 .b-tbl tr{display:grid;gap:6px;padding:16px 0;border-bottom:1px solid var(--rule)}
 .b-tbl tbody:first-of-type tr:first-child{border-top:1px solid var(--ink)}
 .b-tbl td{display:grid;grid-template-columns:minmax(84px,34%) 1fr;gap:12px;padding:0;border:0;font-size:15px}
 .b-tbl td::before{content:attr(data-l);font-size:12px;color:var(--ink3);font-weight:500;padding-top:2px}
 .b-tbl td:first-child{display:block;font-size:17px;padding-bottom:2px}
 .b-tbl td:first-child::before{display:none}
}
.dot.p{color:var(--ink3)}
.kv{margin-top:28px;font-size:15px;letter-spacing:-.007em}
.kv div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;padding:16px 0;border-top:1px solid var(--rule)}
.kv div:last-child{border-bottom:1px solid var(--rule)}
.kv dt{color:var(--ink3)}
.kv dd{font-weight:400;color:rgba(19,19,19,.82)}
.kv ul{padding-left:18px;display:grid;gap:6px}
@media (max-width:560px){.kv div{grid-template-columns:1fr;gap:4px}}
.steps{margin-top:40px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-top:1px solid var(--ink)}
.steps li{padding:16px 16px 0 0;display:grid;gap:4px;align-content:start;font-size:14px;letter-spacing:-.007em;color:var(--ink2);font-weight:400;line-height:1.4}
.steps li i{font-style:normal;font-size:12px;color:var(--ink3)}
.steps li b{font-size:18px;letter-spacing:-.014em;color:var(--ink);font-weight:500}
.dec{margin-top:64px;background:var(--paper);padding:28px 28px 8px}

.dec header span{font-size:13px;color:var(--ink3);letter-spacing:-.007em}

.dec dl div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:14px 0;border-top:1px solid var(--rule);font-size:15px;letter-spacing:-.007em}

.done{margin-top:36px;padding:16px 20px;border-left:2px solid var(--ink);background:var(--paper);font-size:15px;line-height:1.5;font-weight:400;color:var(--ink2);letter-spacing:-.007em}

/* persona cards: icon, handoff arrows, pain marker */
.zc-i{position:relative}
.zc-ic{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:12px;color:var(--ink);margin-bottom:14px;transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease)}
.zc-ic svg{width:22px;height:22px}
.zc-i:hover .zc-ic{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.zc-ho{position:absolute;top:31px;right:-20px;z-index:2;width:24px;height:24px;border-radius:50%;background:var(--ground);border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink3)}
.zc-ho svg{width:12px;height:12px}
.zc-i .pain small{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;font-weight:500}

.zc-i .pain{display:block}
@media (max-width:1100px){.zc-ho{display:none}}
@media (max-width:560px){.zc.zc-flow{gap:22px}.zc.zc-flow .zc-ho{display:grid;top:auto;bottom:-24px;right:auto;left:50%;transform:translateX(-50%) rotate(90deg)}}

/* flowing path diagram */
.wv{margin-top:32px}
.wv-plot{position:relative;height:clamp(300px,26vw,360px)}
.wv-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wv-plot path{fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.wv-plot ol{list-style:none;margin:0;padding:0}
.wv-plot li{position:absolute;left:var(--x);top:var(--y);width:0;height:0}
.wv-plot li i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;border:1.4px solid var(--ink);background:var(--ground);transition:transform .3s var(--ease)}
.wv-plot li.on i{background:var(--ink)}
.wv-plot li:hover i{transform:scale(1.35)}
.wv-plot li span{position:absolute;left:0;transform:translateX(-50%);width:max-content;max-width:150px;text-align:center;display:grid;gap:5px}
.wv-plot li.up span{bottom:24px}
.wv-plot li.first span{transform:translateX(-14px);text-align:left}
.wv-plot li.last span{transform:translateX(calc(-100% + 14px));text-align:right}
.wv-plot li.dn span{top:24px}
.wv-plot li b{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;line-height:1.35;color:var(--ink)}
.wv-plot li em{font-style:normal;font-size:13px;line-height:1.35;color:var(--ink3);font-weight:400;letter-spacing:-.005em}
.wv-ph{position:relative;height:42px;margin-top:6px}
.wv-ph p{position:absolute;left:var(--a);right:var(--b);top:0;border-top:1px solid var(--ink);padding-top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:center}
.wv-ph p::before,.wv-ph p::after{content:"";position:absolute;top:-1px;width:1px;height:7px;background:var(--ink)}
.wv-ph p::before{left:0}.wv-ph p::after{right:0}
.wv-tail{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--paper);font-size:14px;line-height:1.45;color:var(--ink2);font-weight:400}
.wv-tail svg{width:14px;height:14px;flex:none;color:var(--ink)}
.wv-tail span{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:500}
[data-theme="dark"] .wv-tail{color:rgba(236,236,236,.78)}
@media (max-width:899px){
 .wv-plot{height:auto}
 .wv-plot svg{display:none}
 .wv-plot ol{position:relative;padding-left:26px;display:grid;gap:22px}
 .wv-plot ol::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;border-left:1.2px dashed var(--ink3)}
 .wv-plot li{position:relative;left:auto;top:auto;width:auto;height:auto}
 .wv-plot li i{left:-26px;top:2px}
 .wv-plot li span,.wv-plot li.up span,.wv-plot li.dn span,.wv-plot li.first span,.wv-plot li.last span{position:static;transform:none;max-width:none;text-align:left;width:auto}
 .wv-ph{display:none}
 .wv-tail span{margin-left:0;width:100%}
}

/* delivery loop with a scroll-driven tracer */
.lp{position:relative;margin-top:40px}
.lp-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lp-track{fill:none;stroke:var(--ink3);stroke-width:1.1;stroke-dasharray:4 5;opacity:.7}
.lp-done{fill:none;stroke:var(--ink);stroke-width:1.4}
.lp-dot{fill:var(--ink);stroke:var(--ground);stroke-width:4;paint-order:stroke;transition:opacity .3s}
.lp-grid{list-style:none;margin:0;padding:0 0 0 48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:64px;column-gap:28px;position:relative}
.lp-grid li{grid-row:var(--r);grid-column:var(--c);position:relative;padding:34px 12px 0 0;display:grid;gap:6px;align-content:start;opacity:.42;transition:opacity .5s var(--ease)}

.lp-node{position:absolute;left:0;top:-5px;width:10px;height:10px;border-radius:50%;border:1.3px solid var(--ink);background:var(--ground);transition:background-color .35s var(--ease)}
.lp-grid li.on .lp-node{background:var(--ink)}
.lp-grid li::before{content:"";position:absolute;left:4.5px;top:9px;height:18px;border-left:1px dashed var(--ink3)}
.lp-grid small{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.06em}

.lp-grid span{font-size:14px;color:var(--ink2);font-weight:400;line-height:1.45}
.lp-note{margin-top:34px;padding-left:48px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink3);font-weight:500}
.lp-note svg{width:16px;height:16px}
@media (max-width:899px){
 .lp-grid{grid-template-columns:1fr;row-gap:30px;padding-left:28px}
 .lp-grid li{grid-row:auto;grid-column:1;padding:0}
 .lp-grid li::before{display:none}
 .lp-node{left:-28px;top:5px}
 .lp-note{padding-left:28px}
}
@media (prefers-reduced-motion: reduce){.lp-grid li{opacity:1}}

/* overview illustrations */

.zc-art svg{display:block;width:100%;height:auto;overflow:visible}

/* problems, grouped by generation */
.pg{margin-top:28px;display:grid;gap:40px}

.gd-why li{font-size:16px;line-height:1.5;color:var(--ink2)}.gd-why b{color:var(--ink);font-weight:500}
.gd-side{display:grid;gap:20px;align-content:start}

/* feature recordings: looping clip in the window frame, chapters beneath that follow the playhead */

.dm-f{position:relative;aspect-ratio:16/9;background:#f7f8fa}
.dm-f video{display:block;width:100%;height:100%;object-fit:cover;cursor:pointer}
.dm-pp{all:unset;position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(17,18,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .25s var(--ease)}
.dm-fs{all:unset;position:absolute;right:52px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(17,18,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .25s var(--ease)}
.dm-fs i{width:11px;height:11px;border:2px solid #fff;border-radius:2px;box-sizing:border-box;clip-path:polygon(0 0,40% 0,40% 100%,0 100%,0 0,100% 0,100% 40%,0 40%,0 60%,100% 60%,100% 100%,60% 100%,60% 0,100% 0)}
.dm-f:hover .dm-pp,.dm-pp:focus-visible,.dm.paused .dm-pp,.dm-f:hover .dm-fs,.dm-fs:focus-visible{opacity:1}
@media (hover:none){.dm-fs{opacity:1}}
.dm-f video:fullscreen{object-fit:contain;background:#fff}
.dm-pp i{width:10px;height:11px;border-left:3px solid #fff;border-right:3px solid #fff;box-sizing:border-box}
.dm.paused .dm-pp i{width:0;height:0;border:0;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.dm-ch{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}
.dm-ch button{all:unset;display:block;cursor:pointer;width:100%}
.dm-ch u{display:block;height:2px;background:var(--rule);text-decoration:none;overflow:hidden;margin-bottom:12px}
.dm-ch b{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.dm-ch span{display:flex;gap:8px;font-size:14px;font-weight:500;letter-spacing:-.007em;color:var(--ink3);transition:color .3s var(--ease)}
.dm-ch em{font-style:normal;font-variant-numeric:tabular-nums}
.dm-ch small{display:block;margin-top:4px;font-size:13px;line-height:1.4;color:var(--ink3);letter-spacing:-.005em;transition:color .3s var(--ease)}
.dm-ch li.on span{color:var(--ink)}.dm-ch li.on small{color:var(--ink2)}
.dm-ch button:hover span{color:var(--ink)}
.dm-ch button:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}
.dm-x{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule)}
.dm-x>div:first-child{grid-column:1/6;padding-right:24px}.dm-x>div:last-child{grid-column:6/13}
.dm-x h6{font-size:14px;font-weight:500;color:var(--ink3);letter-spacing:-.007em;margin:0 0 10px}
.dm-x p{font-size:15px;line-height:1.55;color:var(--ink2);letter-spacing:-.007em;margin:0;font-weight:400}
.dm-x ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.dm-x li{font-size:15px;line-height:1.5;color:var(--ink2);letter-spacing:-.007em;font-weight:400}
.dm-x li b{display:block;font-weight:500;color:var(--ink);margin-bottom:2px}
.dm-x li span{display:block}.dm-x li span::first-letter{text-transform:uppercase}
@media (max-width:899px){.dm-x{grid-template-columns:1fr;gap:24px}.dm-x>div:first-child,.dm-x>div:last-child{grid-column:1;padding:0}}
@media (max-width:560px){.dm-x ul{grid-template-columns:1fr}}
@media (max-width:899px){.dm-h{grid-template-columns:1fr;gap:6px}.dm-h small,.dm-h>div{grid-column:1}}
@media (max-width:760px){.dm-v.stage{padding:4% 3%}.dm-ch{grid-template-columns:1fr;gap:0;margin-top:12px}.dm-ch li{border-top:1px solid var(--rule)}.dm-ch li:first-child{border-top:0}
 .dm-ch button{display:grid;grid-template-columns:auto 1fr;column-gap:12px;padding:10px 0;position:relative}.dm-ch u{position:absolute;left:0;right:0;bottom:-1px;margin:0;background:none}
 .dm-ch span{grid-row:1}.dm-ch small{grid-column:2;grid-row:1;margin:0;align-self:center}.dm-ch li:not(.on) small{display:none}.dm-ch li.on small{display:block}}
/* 3i snapshot under the case hero */
.snap{margin-top:clamp(40px,4.5vw,72px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.sn-c{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:20px 24px 24px;cursor:pointer;position:relative;transition:background-color .3s var(--ease)}
.sn-c+.sn-c{border-left:1px solid var(--rule)}
.sn-c:first-child{padding-left:0}.sn-c:last-child{padding-right:0}
.sn-c:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.sn-c:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.sn-c header{display:flex;align-items:baseline;gap:10px}
.sn-c header small{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sn-c h4{font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.2vw,32px);line-height:1.05;letter-spacing:-.012em;margin:0;color:var(--ink)}
.sn-k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin:0}
.sn-p{font-size:15px;line-height:1.5;color:var(--ink2);letter-spacing:-.007em;margin:0;font-weight:400}
.sn-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sn-l li{font-size:14px;line-height:1.4;color:var(--ink2);padding-left:16px;position:relative;font-weight:400}
.sn-li li b{font-weight:500;color:var(--ink)}
.sn-l li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:1px;background:var(--ink3)}
.sn-g{list-style:none;margin:0;padding:0;display:grid;gap:0}
.sn-g li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.sn-g li:first-child{border-top:0;padding-top:2px}
.sn-g b{font-family:var(--serif);font-weight:400;font-size:21px;white-space:nowrap;line-height:1;color:var(--ink);letter-spacing:-.01em}
.sn-g span{display:block;font-size:14px;font-weight:500;color:var(--ink);letter-spacing:-.007em;margin-bottom:3px}
.sn-g p{font-size:14px;line-height:1.45;color:var(--ink2);margin:0;font-weight:400}
.sn-n{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 16px;margin:0}
.sn-n div{display:grid;gap:4px;align-content:start}
.sn-n dt{font-family:var(--serif);font-size:clamp(28px,2.4vw,36px);line-height:1;letter-spacing:-.02em;color:var(--ink)}
.sn-n dd{margin:0;font-size:13px;line-height:1.4;color:var(--ink2);font-weight:400}
.sn-go{margin-top:auto;padding-top:6px;font-size:13.5px;font-weight:500;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.sn-go i{font-style:normal;transition:transform .3s var(--ease)}
.sn-c:hover .sn-go i{transform:translateX(4px)}
@media (max-width:899px){.snap{grid-template-columns:1fr}.sn-c{padding:20px 0 24px!important}.sn-c+.sn-c{border-left:0;border-top:1px solid var(--rule)}.sn-c:hover{background:none}}
/* hero in light mode: same layout and motion, light ground */
[data-theme="light"] .hero{background:var(--ground);color:var(--ink)}
[data-theme="light"] .hero .brain{background:radial-gradient(var(--gr,400px) calc(var(--gr,400px)*.8) at var(--gx,50%) var(--gy,56%),rgba(40,170,180,.095),transparent 72%)}
[data-theme="light"] .hb{color:var(--ink2)}
[data-theme="light"] .hb b{color:var(--ink)}
[data-theme="light"] .hb .aff a{color:var(--ink3)}
[data-theme="light"] .hb .aff a:hover,[data-theme="light"] .hb .aff a:focus-visible{color:var(--ink)}
[data-theme="light"] .hbtn{color:var(--ink);border-color:rgba(19,19,19,.24);background:rgba(19,19,19,.02)}
[data-theme="light"] .hbtn:hover,[data-theme="light"] .hbtn:focus-visible{background:rgba(19,19,19,.06);border-color:rgba(19,19,19,.55)}
[data-theme="light"] .hbtn.pri{background:#161616;color:#fff;border-color:transparent}
[data-theme="light"] .hbtn.pri:hover,[data-theme="light"] .hbtn.pri:focus-visible{background:#000}
[data-theme="light"] .hbtn:focus-visible{outline-color:var(--ink)}
[data-theme="light"] .logos .lw{color:var(--ink)}
[data-theme="light"] .logos img{filter:brightness(0)}
[data-theme="light"] .top.on-dark{color:var(--ink)}
[data-theme="light"] .top.on-dark .tg[aria-checked="false"] .tg-sun,[data-theme="light"] .top.on-dark .tg[aria-checked="true"] .tg-moon{color:var(--ground)}
.hero,.hb,.hb b,.logos .lw,.top,.cue{transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease)}

  ["h3","Gen 2 · From the parts of an agent to the life of a solution","v4","Gen 2 · Expansion"],
  ["note","Gen 2 · Feb – Sep 2026 · Expansion"],
  ["p","Gen 1 assumed the user knew what to build. In client work the slow, risky part came before and around the build. I reorganised seven modules into five stages, so the order of the menu is the order of the work."],
  ["q","How might an enterprise team go from a business problem to a governed, deployed solution in one place?"],
  ["h4","Problems it solved"],
  ["gprob",[{"ic": "route", "h": "Work lived outside the product", "e": "Planning, process knowledge and test data sat outside ZBrain.", "r": "Five stages in work order; Interview Agent, Design and Datasets feed the Builder"}, {"ic": "sliders", "h": "Controls stopped at each app", "e": "No account-wide policy, no regulation mapping, no global stop.", "r": "Policy templates, compliance frameworks and a kill switch"}]],
  ["h4","What carried on"],
  ["p","Nothing from Gen 1 was thrown away. Agents and crews, guardrails, prompts and the Prompt Manager, and cost per run all moved into Gen 2 as tabs inside the stage where they are used. What changed was the order around them."],
  ["fig","zb/v4-modules-stages","Seven modules became five stages: new items highlighted; the Gen 1 modules became tabs inside the stages."],
  ["h4","Why a new direction"],
  ["gdir",{"why": [["The buyer changed.", "After Hackett acquired LeewayHertz in 2024, ZBrain was sold to enterprise AI programmes, not single teams."], ["Expectations changed.", "Prompt-to-app tools made “describe it, get it built” the norm."], ["Risk became the blocker.", "Gartner said over 40% of agentic AI projects may be cancelled by 2027."]], "comp": ["Copilot Studio", "Gemini Enterprise", "Agentforce", "watsonx Orchestrate", "OpenAI AgentKit"], "bar": "Describe it, get it built, and show how it’s governed."}],
  ["h4","Why a new navigation"],
  ["demo",{v:"zb/zb-v4-nav",n:"01",k:"Navigation · Five stages",h:"The menu became the order of the work",
   p:"In Gen 1 the top bar listed seven modules, and a new user had to know which one came first. Gen 2 reads left to right: see what needs attention, prepare what to build, build it, govern what runs, and set up the shared plumbing once. Every Gen 1 module still exists, now as a tab inside the stage where it is used.",
   ch:[[0,"Dashboard","An AI summary, status cards and a ranked list of actions"],[4.8,"Prepare","Design, knowledge, prompts and datasets"],[10,"Build","Solutions, agents and agent groups, flows"],[15.4,"Monitor","Policy templates, compliance, roles, audit and a kill switch"],[17.2,"Configure","Models, connections, MCP, variables, environments, storage"]],
   why:"As Gen 1 grew, the seven modules read as a list of parts, not a path. Client teams kept asking where to start, and the slow, risky work before a build (scoping, gathering knowledge, test data) had no home at all. Ordering the menu by the life of a solution gave that work a place and made the next step obvious.",
   who:[["Scopers and PMs","start in Prepare, with design, knowledge and datasets in one place."],["Builders","work in Build, with solutions, agents and flows side by side."],["Overseers","open the Dashboard to a short, ranked list of what needs fixing."],["Admins and gatekeepers","set models, connections and policy once, in Configure and Monitor."]]}],
  ["h4","How the journey is streamlined"],
  ["p","What the Interview Agent collects feeds the design; the design feeds the datasets; both feed the Builder. In Gen 1 each step started from scratch."],
  ["wave",{nodes:[["Interview Agent","employees, by email"],["Knowledge","analysed and stored"],["Design","BRD, epics, user stories"],["Dataset","scenarios from the design"],["Solution Builder","plan, approve, build"],["Deploy","GitHub, staging, production"],["Monitor","policy, kill switch"],["Dashboard","ranked actions"]],
   phases:[["Prepare · design and datasets feed the build",0,3],["Build, ship, govern, track",4,7]],
   tail:"Configure · models, connections, MCP, variables, environments, database, storage"}],
  ["h4","Interviews: knowledge from the people who do the work"],
  ["demo",{v:"zb/zb-v4-interview",n:"02",k:"Prepare · Knowledge · Interview Agent",h:"Knowledge straight from the people who do the work",
   p:"The knowledge an AI solution needs most is rarely written down: how invoices really get approved, where onboarding stalls, which workaround everyone uses. Documents describe the official process; people know the real one. So besides importing from data sources, a knowledge base can now be filled by an Interview Agent that a team sends to employees. The agent works from a catalogue of topics, each saying what to focus on, why it matters and when the answer is good enough, so it asks follow-ups until it has the context it needs.",
   ch:[[0,"Source","Import from data sources, or collect through an interview"],[3.6,"Brief","Company, purpose, expected output and tone"],[9.3,"Topics","A generated catalogue of what to ask, and when it is enough"],[16.4,"Style","Branding, look, and whether people can share images, files or screen"],[22.1,"Invite","Test it yourself, then invite people by name, team and role"],[31,"Interview","An email link, then a voice-first conversation they can resume"]],
   why:"Discovery was the slowest part of client projects. Workshops took weeks to schedule, notes lived with one consultant, and the documents a client handed over described the process on paper. Designs then rested on guesses, and the gaps surfaced only after the build.",
   who:[["Employees","explain their work in their own words, by voice, when it suits them, and can pick up again from the email link."],["PMs and consultants","hear from many people at once, with answers filed against the topics they chose instead of transcripts to read."],["Builders","inherit a knowledge base with real pain points, exceptions and workarounds, which feeds straight into Design."]]}],
  ["h4","Scoping: the plan before the build"],
  ["demo",{v:"zb/zb-v4-design",n:"03",k:"Prepare · Design",h:"Scope the whole solution before anyone builds it",
   p:"Design is where a PM turns everything known about a problem into a plan. They describe the solution in plain words or upload the PRD, business case or RFP, pull in knowledge bases, interview results and other files, and answer a short set of questions across five steps: project description, solution identity, architectural layers, questions and deliverables. ZBrain then drafts the functional and technical scope (workflows, architecture, personas, epics and user stories) as numbered deliverables the team reviews and edits together.",
   ch:[[0,"Project","Client, project name and team"],[6.4,"Describe","A plain-language brief plus PRD, business case or RFP, each file summarised"],[17.3,"Workspace","Knowledge, questionnaire and deliverables side by side"],[21.8,"Deliverables","Workflow, functional and architecture diagrams, schema, services, epics, stories, BRD"]],
   why:"Scoping used to happen in slides and documents outside the platform, so a build started from someone’s summary and the reasons behind decisions were lost along the way. Keeping the source material, the answers and the plan together in the product means everything downstream, from datasets to the Solution Builder, reads from the same agreed scope.",
   who:[["PMs and scopers","react to a complete first draft of the scope instead of starting from a blank document."],["Business owners","review personas, user stories and the BRD in language they recognise."],["Architects and developers","see diagrams, data schema and services to challenge before any code exists."],["Builders","open the Solution Builder with the approved plan already loaded."]]}],
  ["h4","Datasets: test data generated from the scope"],
  ["p","A solution cannot be tested without data, and on most client projects real data arrives late, is sensitive, or covers only the easy cases. Datasets solves that inside Prepare: a PM describes the data they need in plain words, and ZBrain generates scenario sets from the approved design, each with its files (records, labels, persona profiles) and a note on exactly what it tests."],
  ["fig","zb/v4-dataset-builder","Datasets: numbered scenarios, each tagged and with its files; the source document stays open beside them, and the finished set is published for testing."],
  ["cards",{c:3,items:[
   {ic:"route",h:"Happy path",p:"The expected case end to end: a baseline for accuracy and response time."},
   {ic:"target",h:"Edge cases",p:"Missing details, records that conflict across systems, ambiguous requests."},
   {ic:"layers",h:"Complex",p:"Several issues in one interaction, such as wrong items, a billing error and an SLA breach together."}]}],
  ["p","Builders test agents against these sets before go-live and can rerun them as a regression suite after every change, and evaluators score results against the same benchmark, so quality is measured the same way at each release."],
  ["h4","Connect to Git"],
  ["p","Most client teams already had code. The Solution Builder connects to GitHub, so teams import an existing repository or package instead of starting again, and a finished solution deploys through GitHub to staging and production. ZBrain explains why it needs access before GitHub asks for it."],
  ["mini",[["Pre-fill, then refine.","People edit a draft built from their documents instead of facing a blank page."],["Structured, not a chat log.","Every answer lands in a named field, every output in a numbered deliverable."],["Rank, don’t list.","The Dashboard orders what needs fixing and gives each a time estimate."]]],
  ["p","I also designed a tailored Gen 2 build for a global electronics test and measurement company: global variables, agent groups with telemetry, flow groups, and flows created by describing them."],
  ["done","Delivered.","Four production releases, 14 Aug to 24 Sep 2026. The Solution Builder and Governance, the two largest pieces, are the deep dives below."],

  ["h3","Gen 3 · From one team’s path to a governed workspace for every team","v5","Gen 3 · Maturity"],
  ["note","Gen 3, the latest · Sep 2026 – now · Maturity"],
  ["p","When finance, HR and sales each wanted their own data, models, budget and rules, the structure had to change again. I own the user portal; Indrajit owns the Admin Console, where IT sets up models, keys and policies once; we designed the places they meet together."],
  ["q","How might business teams build their own AI solutions while IT keeps control, without IT becoming a bottleneck?"],
  ["h4","Problems it solved"],
  ["gprob",[{"ic": "spaces", "h": "One workspace for everyone", "e": "Each team needed its own data, models, budget and rules.", "r": "Spaces and roles frame every screen"}, {"ic": "noentry", "h": "“Not allowed” was a dead end", "e": "Approvals happened over email, with no record.", "r": "Requests in context, and one admin queue"}]],
  ["h4","What carried on"],
  ["p","The three jobs from Gen 1 stayed the same: see what is going on, build, and keep it safe. Plan-then-build and account-wide policy carried over from Gen 2. What changed is that each job now happens inside a team’s own Space."],
  ["jobs",[
   ["Seeing what is going on",[["zb/v3-control-tower","Gen 1 · Control Tower, a concept"],["zb/v4-dashboard","Gen 2 · Dashboard for one workspace"],["zb/v5-observatory","Gen 3 · Observatory per Space: risk first, with Kill on the agent’s row"]]],
   ["Building",[["zb/v3-builder","Gen 1 · Chat Builder, a concept"],["zb/v4-builder-v3","Gen 2 · Solution Builder: plan, approve, build"],["zb/v5-editor-sessions","Gen 3 · Solution workspace with sessions"]]],
   ["Keeping it safe",[["zb/v3-configure-bot","Gen 1 · Guardrails set inside each app"],["zb/v4-compliance","Gen 2 · Account-wide policy and frameworks"],["zb/v5-computed-policy","Gen 3 · Policy computed per solution"]]]]],
  ["h4","Why a new direction"],
  ["gdir",{"why": [["Scale across business units.", "Finance, HR and sales each needed their own data, models and rules."], ["Agent sprawl.", "Microsoft’s Agent 365 made governing agents a product category of its own."], ["Separation of duties.", "IT has to approve access without becoming the bottleneck for every change."]], "comp": ["Microsoft Agent 365", "ServiceNow AI Control Tower", "Gemini Enterprise"], "bar": "Design-to-deployment across clouds, backed by Hackett’s process knowledge."}],
  ["h4","Why a new navigation"],
  ["p","Gen 2’s five stages assumed one team on one account. With many teams on one account, the first question became “whose work am I looking at?”. So Gen 3 splits the product in two: the Admin Console, where IT sets up people, models, keys and policy once, and a Space for each team. Inside a Space the sidebar shows only that team’s solutions, models and budget, and a switch moves between Spaces and the Console."],
  ["demo",{v:"zb/zb-v5-console",n:"01",k:"Admin Console · Spaces",h:"IT sets the rules once; every team works inside them",
   p:"Gen 3 is two products that meet. In the Admin Console, IT manages people, IP access, models, connections, API keys and policies for the whole account, and watches every Space from one Observatory. Each team works in its own Space: the same Observatory, scoped to its own solutions, with the policy that governs it at the foot of every screen and a button to request a change. Requests from every Space land in one queue, and approving one applies the change to that Space at once. Indrajit designed the Admin Console and I designed the user portal; the switcher, the policy card and requests, where the two meet, we designed together.",
   ch:[[0,"Observatory","Cost, runs, agents at risk and violations across all Spaces"],[7.6,"Spaces","One per team, each with its policy, members and budget"],[9.3,"Access","Who can sign in, and which IP ranges may call the platform"],[17.2,"Resources","Models, connections and API keys, set up once"],[19.4,"Governance","Requests, policies and the agent log, with Kill on the row"],[31.8,"Switch","Into a Space: the same view, scoped to Finance and its rules"]],
   why:"Once several teams built on one account, a single workspace stopped working. Finance should not see HR’s data, each team wanted its own models and budget, and IT could not review every agent by hand. Without a shared frame, IT either became the bottleneck for every change or lost sight of what was running.",
   who:[["IT admins","set models, keys, access and policy once, see risk across every Space, and stop a misbehaving agent from its row."],["Space owners","get a workspace scoped to their team, with the rules that apply visible on every screen."],["Builders","work freely inside those rules, and ask for an exception, such as a model, a data source or a bigger budget, right where they need it."],["Security and compliance","review one agent log, one audit trail and one set of policies for the whole account."]]}],
  ["mini",[["The Space is the frame.","A finance builder sees finance solutions, models and budget; HR’s work is simply not there."],["The rules sit next to the work,","at the foot of every screen, not in a settings page."],["Role and grant are separate.","A role says what kind of work you do; grants say which solutions."]]],
  ["h4","What the Builder can do now"],
  ["p","In Gen 2 the Builder was one chat that made one app. In Gen 3 a solution is a living product that several people change at once, so the Builder grew new abilities."],
  ["cards",{c:3,items:[{"ic": "crew", "h": "Many builders, one solution", "p": "Each builder works in a session, a branch of Main with its own live preview, and merges back through a pull request."}, {"ic": "layers", "h": "Code one click away", "p": "The full codebase sits beside the preview, for developers who need to read or change it."}, {"ic": "route", "h": "Components and connections", "p": "Integrations, MCPs, connectors and plugins sit next to the build, so a solution connects straight to the systems it needs."}, {"ic": "approve", "h": "Deploy by approval", "p": "Main is what deploys. Release is approval-based: Dev first, then UAT and Production."}, {"ic": "shield", "h": "Governance inside the build", "p": "Every solution shows its computed policy, compliance, audit trail and violations, without leaving the workspace."}, {"ic": "fold", "h": "Artifacts from the scope", "p": "Prepare drafts the agentic workflow, diagrams, a spec per agent, epics and user stories, all editable with an AI assistant."}]}],
  ["h4","Role-based delivery"],
  ["p","In Gen 2 one builder did everything in one chat. Now a solution passes between four roles, with a review that can send work back."],

  ["figs",[["71-64","Prepare: design projects per client, with status, cost and owner."],["71-68","Design deliverables: an architecture diagram with an AI assistant that edits it."]],2],
  ["p","Deep dive 1 below shows the Gen 3 workspace in motion."],

  ["p","Gen 3 moved governance from settings pages to the places where work happens: the Space, the solution and the agent’s own row."],
  ["cards",{c:3,items:[{"ic": "oversee", "h": "An Observatory for every Space", "p": "Risk comes first: agents at risk, violations, cost and runs. Each agent has a trust score, and Kill sits on its row."}, {"ic": "sliders", "h": "Policy computed per solution", "p": "Account rules are locked, solution rules add on top, and each rule shows its computed value, source and action."}, {"ic": "info", "h": "A log that explains every block", "p": "Each violation shows what the agent tried, the prompt and the rule it hit, with a way to flag a false positive or adjust the rule."}]}],

  ["h3","Deep dive 1 · The Solution Builder","dd-builder","Deep dive · Solution Builder"],
  ["p","Building a whole application for one business process, such as Invoice-to-Pay, by chat. A concept in Gen 1, four rounds in Gen 2, a multi-builder workspace in Gen 3."],
  ["note","Shows: conversational AI interaction design, and iteration"],
  ["kv",[["Problem","Building meant assembling parts: each agent, flow, app and connection configured in its own module, by someone who knew every module. The business needed one path that starts from the design and datasets it already has."]]],
  ["h4","User flow"],
  ["chain",{items:[["Describe it","attach files, a Design or a dataset"],["Plan","the Builder writes one"],["Approve","“I approve the plan”"],["Build","steps fold to one line"],["Preview","the live app"],["Change","by chat"],["Publish",""]]}],
  ["h4","Alternatives explored"],
  ["figs",[["zb/v4-builder-v0","v0 · Tabs to fill in. A form per part was the same assembly work as Gen 1, regrouped."],["zb/v4-builder-v1","v1 · Guided chat. Linear and slow; nothing visible until the end."],["zb/v4-builder-v2","v2 · Chat, preview, code. Raw code and logs too early for business users."]],3],
  ["dec",{n:"Decision 1",h:"Should the AI build the app, or help the builder build it?",opts:"Forms to fill in · a guided chat · a chat with a preview and code · a chat that shows a plan, waits for a yes, then builds step by step",chose:"Plan first, then build. The AI shows its plan and builds nothing until a person approves it.",trade:"It’s slower than building everything in one go. But the builder understands what was built and can fix it.",why:"Prompt-to-app tools made people expect speed. Enterprise teams wanted that speed too, but they also needed to see every step."}],
  ["dec",{n:"Decision 2",h:"How much of the AI’s work should the builder see?",opts:"Only the final code · every raw log and reasoning step · each step as one short line, with the app shown next to it",chose:"Show every step, but keep each one to a single line with counts, and show the live app next to the chat. Builders can check the work without reading a wall of text, and they judge the app itself, not the AI’s description of it.",trade:"The first run takes longer. In return, everything the AI makes can be seen and edited."}],
  ["dec",{n:"Decision 3",h:"How do builders change what the AI built?",opts:"Type every change in the chat · click any part of the live preview and say what to change",chose:"Click and edit. The builder clicks a part of the app and describes the change. The model picker sits next to the prompt. If company rules require it, publishing becomes a request to an admin.",trade:"The editor is harder to build. In return, changes are precise and nobody has to rewrite long prompts."}],

   p:"In Gen 2 the Builder was one chat that produced one app. By Gen 3 a solution is a living product that several people change at once, so the Builder grew into a workspace. Main is what deploys. Each builder works in a session, a branch of Main with its own live preview, and merges back through a pull request. The code is one click away for developers, connections and tools sit beside the build, and every solution carries its own deployment history and governance: the policy computed for it, compliance coverage, an audit trail and violation logs.",

 secs:[
 S("identify","01","Identify","Hundreds of AI ideas, and no defensible way to choose",[
  ["h3","The problem","problem-x","The problem"],
  ["p","Large companies run AI centres of excellence (CoEs) that field hundreds of AI ideas. Choosing between them is slow and political: ideas arrive through workshops, estimates are guesses, and nobody can say what the company already owns."],
  ["p","XPLR exists to answer three questions in order: where could AI help us, which ideas are worth it, and what exactly should we build? Its answer is a pipeline. Each step narrows the field, and the last hands a blueprint to ZBrain to build."],
  ["steps",[["Context","Company and technology landscape"],["Discover","Industry and Process XPLR"],["Ideate","Guided ideation intake"],["Ground","Data XPLR"],["Size","Benefit case and feasibility"],["Prioritise","ROI and CoE dashboard"],["Build","Blueprint, handed to ZBrain"]]],
  ["h3","Who it serves","users-x","Who it serves"],
  ["p","Five roles touch that pipeline, and each needs something different from it."],
  ["tbl",["Role","What they need","Where in XPLR"],[["AI CoE lead","A portfolio of AI ideas they can defend and fund","CoE dashboard, ROI"],["Process owner","To describe their work without a workshop","Ideation intake, Data XPLR"],["Hackett consultant","Faster discovery on client engagements","Industry and Process XPLR"],["Technology team","To check feasibility and data before approving","Feasibility, data score, approvals"],["Executive sponsor","To know what to fund next, and why","ROI recommendation, mobile"]]],
  ["h3","Where it fell short","gaps-x","Where it fell short"],
  ["p","XPLR 2.0 led with its library: 26 industry taxonomies, 4,272 AI solutions and 25,244 agents. It impressed in demos, but it was the same for every client, and in real engagements the same three gaps kept coming up. They became the three problems I designed for."],
  ["cards",{c:3,items:[
   {k:"Gap A",h:"It didn’t know the client",p:"Recommendations ignored the company’s own processes and the systems it already runs."},
   {k:"Gap B",h:"Ideas needed a consultant",p:"Intake ran through workshops; process owners couldn’t contribute on their own."},
   {k:"Gap C",h:"ROI couldn’t be defended",p:"A single estimate with no baseline didn’t survive a funding meeting."}]}],
  ["h3","The bar to clear","market-x","The bar to clear"],
  ["p","Competitors each solved one piece. The opening was to carry an idea all the way from discovery to a defensible, build-ready blueprint."],
  ["tbl",["Era","Competitor","How XPLR differed"],[["2024 · Libraries","Gartner AI Use-Case Insights; IDC GenAI Use Case tool","Simulated use cases against a client’s own processes, and carried each idea through to a blueprint"],["2025 · Process data","Celonis; SAP Signavio","Celonis became a partner. Signavio maps processes well, but has no ROI or path to build"],["2025–26 · Pipelines","UiPath Automation Hub","Tracks ideas; XPLR sizes and designs each one against Hackett benchmarks"]]]
 ]),
 S("iterate","02","Iterate","Three gaps, closed in the order a client meets them",[
  ["h3","How I worked","how-x","How I worked"],
  ["p","I worked release by release, and each release closed one gap in the order a client meets it: first XPLR has to know the company, then capture its ideas, then prove which ones are worth funding."],
  ["kv",[["Business analysts","Turned their process knowledge and Hackett’s taxonomy into screens and flows."],["Language-model team","The model produced opportunities, scores and summaries. I decided what it shows, how it explains itself, and where a person confirms."],["Consultants and clients","Designs came from real engagements such as invoice-to-pay."]]],
  ["h3","How the product moved","moved-x","How it moved"],
  ["kv",[["2.0 → 3.0","From a library to your industry: industry-specific exploration and feasibility."],["3.0 → 4.0","From your industry to your company: Technology Landscape Intelligence catalogues what a client already runs (Gap A)."],["4.0 → 5.0","From consultant-led to self-serve: guided intake and a CoE dashboard (Gap B), then every number made defensible (Gap C)."]]],
  ["tbl",["Release","Top-level navigation"],[["2.0","Dynamic Simulation, Taxonomy, Solution, Portfolio, Functional Design"],["3.0–4.0","Industry, Process, Solution, Portfolio"],["5.0","Dashboard, Process, Ideation, Solution, Portfolio, Data"]]],
  ["h3","A · From a library to your own company","a","Gap A · Know the company"],
  ["p","Gap A first, because nothing else works without it. XPLR 2.0 opened on the size of its library, so a client still had to ask which solutions fit them, and what they already had."],
  ["q","How might a client see only the AI opportunities that fit their industry, their processes and the systems they already run?"],
  ["dec",{n:"Decision A1",h:"Start with the solution library, or with the client’s company?",opts:"Open on the library with filters · ask about the company first and use it to filter everything · make company details optional",chose:"Ask about the company first, in a short setup: company details, the software they already use in each department, and the AI projects they already have. All of it can be changed later.",trade:"People do some setup before they see anything useful. In return, every screen after that is about their company.",why:"Hackett’s own release put the client’s technology first. Asking up front was the only way to stop suggesting tools the client already had."}],
  ["figs",[["88-159","Before: 2.0 opened on library counts, the same for every client."],["88-164","After: a three-step first run, starting with the company."],["88-170","After: the technology landscape, function by function."]],3],
  ["dec",{n:"Decision A2",h:"Show a list of AI solutions, or show the client’s actual process?",opts:"A simple list for each department · drill down step by step until you reach the client’s process diagram · a chat that suggests solutions",chose:"The drill-down. You go from front, middle or back office, to a department, to a process. Each level shows how many opportunities it has and how big they are. At the end you see the process diagram, with the AI opportunities and data sources next to it.",trade:"More clicks to reach the answer. In return, every suggestion points to a real step in a real process.",why:"Process owners already trust these process diagrams (BPMN), and Hackett’s benchmarks are sorted by process. Matching both made each suggestion easy to explain."}],
  ["figs",[["86-72","Taxonomy explorer: counts by Breakthrough, Transformative and Incremental."],["86-76","The drill-down ends at the process diagram."],["86-81","Solutions for that process, with impact, ROI and complexity."]],3],
  ["p","With the company in context, XPLR could recommend the right solutions. The next bottleneck was input: the ideas themselves still came from consultant-run workshops."],

  ["h3","B · Capturing ideas without a consultant in the room","b","Gap B · Self-serve ideas"],
  ["p","To scale beyond a few workshops, the people who do the work had to describe it themselves, and most process owners aren’t writers."],
  ["q","How might a process owner describe how their work really happens, quickly and completely, without a consultant writing it up?"],
  ["dec",{n:"Decision B1",h:"Give people a blank page, or guide them?",opts:"One long form · free text that AI sorts out later · four guided questions that pull in what’s already known, then an AI review",chose:"Four guided questions: how the process works today, the result you expect, any ideas you have, and how you’ll measure success. Each has “Add from Data XPLR”, so people don’t retype what’s already there. Then Evaluate turns the answers into opportunity cards showing effort, return on investment and a recommended pick.",trade:"People still type some things. In return, the AI gets clear input it can rank, and a consultant can check it.",why:"If information is already in Data XPLR, nobody should have to type it again."}],
  ["figs",[["88-175","Ideation: four guided fields, each able to pull from Data XPLR."],["88-179","Evaluate returns opportunity cards with complexity, ROI and a pick."],["88-183","Data XPLR: build knowledge once, reuse it in every intake."]],3],
  ["dec",{n:"Decision B2",h:"Can an AI watch how people work, while they stay in control?",opts:"Forms only · an AI that interviews people while they share their screen · the same AI interviewer, plus a review of each summary before it’s used",chose:"An AI interviewer that asks about the same four topics. People see their progress, can pause or stop at any time, and review the summary before anything is used.",trade:"Sharing a screen raises consent concerns, so the person controls what is shared and sees everything that’s captured. This work isn’t released yet, so it isn’t shown here."}],
  ["p","Easier intake brought in more ideas, which raised the stakes on choosing between them. That made the ROI itself the last gap to close."],

  ["h3","C · Making ROI defensible","c","Gap C · Defensible ROI"],
  ["p","Early estimates were single figures with no baseline. CoE leads needed numbers they could defend in a funding meeting, and a fair way to say no to weak ideas."],
  ["q","How might every AI opportunity carry an ROI a finance team would accept, and a clear reason for its priority?"],
  ["dec",{n:"Decision C1",h:"Show one number, or show how we got there?",opts:"One estimated benefit · a starting value and a target for each measure · a starting value, a target and Hackett’s best-in-class benchmark",chose:"Show the benchmark next to every target. Benefit Case 2.0 lists each measure with where the client is today, the target, and what the best companies achieve. Costs are split into proof of concept, full rollout and upkeep.",trade:"The screen has more on it. In return, targets are based on a benchmark, not a guess.",why:"Benchmarks are what Hackett is known for. Putting one next to every target turns a claim into something the client can check."}],
  ["fig","87-125","Benefit Case 2.0: baseline, target and world-class benchmark for each indicator."],
  ["dec",{n:"Decision C2",h:"Just rank the options, or explain the ranking?",opts:"Sort by return on investment · one combined priority score · the score, plus written reasons, how ready the data is, and a way to push an option down",chose:"Explain the ranking. Each option shows whether its data is Ready, needs Review or is Missing, and waits for the technology team to approve it. Weak options move down the list; they aren’t deleted.",trade:"The suggestion can still be wrong. So it’s shown as advice with its reasons visible, and people make the final call."}],
  ["figs",[["88-188","Feasibility: data score, and approval pending from the technology team."],["88-196","The end of the line: a blueprint, ready to build in ZBrain."]],2],
  ["p","Together the three moves turn XPLR into one pipeline: the company’s context in, ideas captured from the people who know the work, the best sized and approved, and a blueprint out to ZBrain."],
  ["h3","Beyond the main flows"],
  ["fig","88-40","The CoE dashboard: opportunities by stage, function and impact."],
  ["fig","88-44","About 110 mobile screens, so sponsors can review intakes, process maps and opportunities away from a desk."],
  ["h3","AI patterns"],
  ["tbl",["Pattern","What it means"],[["Context before content","Company, systems and processes come first"],["A benchmark beside every number","A claim becomes a comparison"],["Show the working","Scores come with written reasoning"],["Evidence status on data","Ready, Review or Missing tells people how far to trust a number"],["People approve each stage","Benefits, feasibility and blueprint each wait for the right team"],["AI drafts, people confirm","Summaries, benefit cases and requirements are drafts to review"]]]
 ]),
 S("impact","03","Impact","What it changed for clients",[

{id:"ce-agent",tier:1,nda:true,name:"CE Agent · Deal Strategy",year:"2025",cat:"AI agent · Microsoft (contract)",
 short:"An AI agent that drafts the renewal plan",thumb:"8-137-r",hero:"53-12-r",
 title:"An AI agent that drafts the renewal plan, and lets the seller argue with it",
 lede:"I designed how Microsoft’s CE Agent turns a Teams question into a structured renewal plan inside MSX, the CRM sellers already use: a drafted plan with its assumptions, a simulator to test it, and alternatives that change nothing until the seller applies them.",
 meta:[["Role","Product designer"],["Team","Microsoft design studio with the CE Agent PMs"],["Timeline","Feb – Mar 2025, six weeks"],["Users","Commercial executives planning large Azure renewals"],["Product","CE Agent in Teams and MSX (Dynamics 365)"],["Type","New AI capability in an existing product"]],
 ov:[["Identify","Commercial executives spend much of their month building deal strategy from dozens of sources. The existing agent could only answer in chat."],["Iterate","Three navigation patterns, seven page layouts, three simulators and four ways to compare plans, decided in short loops with the PMs."],["Impact","One end-to-end flow from a Teams chat to a quote, demoed to stakeholders on 3 and 19 March 2025."]],
 secs:[
 S("identify","01","Identify","Who struggled with what, and why it mattered",[
  ["h3","Context"],
  ["p","Commercial executives lead the commercial strategy for Microsoft’s largest customers: the right mix of Azure consumption, discounts and products for each renewal. One plan combines the consumption target, annual commitment discount, reserved instances, special pricing, past usage and likely growth."],
  ["p","CE Agent already existed as a chat assistant in Teams. It could answer questions about a deal, but a renewal plan is a set of numbers a seller has to compare, adjust and defend. The team wanted the agent to draft that plan inside MSX, where the deal is recorded."],
  ["fig","53-145-r","Before: CE Agent answered in Teams chat. Rich, but hard to compare, save or turn into a quote."],
  ["h3","Five jobs, and the one we picked"],
  ["tbl",["Job","Scope"],[["Compile deal history","Out of scope"],["Develop deal strategy and model quote options","This project"],["Select offers and create a quote","Fed by this project"],["Execute the deal through negotiation","Out of scope"],["Support customers on licensing","Out of scope"]]],
  ["note","From jobs-to-be-done research shared by the PMs."],
  ["p","With the PMs I assessed which data sources (agreements, usage, pricing, concessions, customer insights, compliance, partners) and Copilot capabilities existed. That showed where the agent could be confident, and where a person had to stay in charge."],
  ["q","How might an AI agent draft a renewal plan that a commercial executive can trust, question and change, without leaving the deal record?"],
  ["kv",[["Known",["The seller’s five jobs and where the time goes","Which data sources and Copilot capabilities existed","Priorities agreed with the PMs"]],["Assumed",["Sellers trust numbers they can trace to a source","Sellers want to explore options before committing","A deal conversation starts in chat but is decided on the record"]],["Constraints",["Six weeks, with two fixed demo dates","Must live in MSX and follow Microsoft’s Copilot patterns","Simulator and edit panel already in UAT, so changes had to work with what engineering had built"]]]]
 ]),
 S("iterate","02","Iterate","How I decided, and what changed after review",[
  ["h3","Approach"],
  ["p","I worked in short loops with the PMs. Each surface got two to four options side by side, and each review ended in a choice, so the demo flow was built from decisions rather than drafts."],
  ["tbl",["When","Milestone","Focus"],[["Mid Feb","Prep board","References, user, jobs to be done, data sources"],["Late Feb","Ideation","Teams chat, navigation and page layouts"],["3 Mar","Demo 1","First flow shown to stakeholders"],["Early Mar","Reviews","Simulator, edit and compare options narrowed"],["19 Mar","Demo 2","Teams to MSX, end to end"]]],
  ["tbl",["Priority","Scope agreed with PMs"],[["P0","Deal Strategy page, Teams chat with prompts, chat reply linking to MSX, create quote"],["P1","Seller edits with contextual risks"],["P2","Table of all SKUs"],["P3","Historical data tab"],["P4–P5","Add SKU and Edit values overlays"]]],
  ["h3","The journey, seller and agent side by side"],
  ["tbl",["Step","Seller","CE Agent"],[["1 · Ask","Asks for a renewal plan in Teams","Replies with a summary and a link to the plan"],["2 · Open plan","Lands on the deal record","Drafts plan, assumptions and comparison with last deal"],["3 · Check","Opens Sources","Lists its sources; states the main risk in one line"],["4 · Simulate","Drags discounts and growth","Shows its proposed value under each slider"],["5 · Edit","Types exact numbers","Regenerates the plan"],["6 · Compare","Compares an option with the current plan","Recommends options; highlights what changes"],["7 · Apply","Confirms the change","Changes nothing until Apply"],["8 · Quote","Creates the quote","Marks every value it updated"]]],
  ["demo",{v:"ce/ce-teams-to-msx",n:"01",k:"Teams to MSX · The main flow",h:"From a question in Teams to a plan on the deal record",p:"Sellers already spend their day in Teams. They ask the sales Copilot about a deal there, get its history, contacts and a draft strategy, then jump straight into the same deal in MSX to check the numbers.",ch:[[0, "Ask in Teams", "The seller asks about a deal by its enrollment number. Copilot replies with the deal history, past purchases and insights."], [4.4, "Contacts and a strategy", "Follow-up questions bring the key customer contacts, then a draft deal strategy with a link to MSX."], [7.4, "Open the deal in MSX", "The link opens the deal record with the plan already drafted. The sales chat stays open on the side."], [13.0, "Compare and simulate", "Charts compare SKUs, discounts and growth with the last deal. The simulator shows what happens with other numbers."], [20.9, "Edit exact values", "An edit panel for precise numbers. Regenerate updates the plan."]],why:"Before, the agent could only answer in chat. Sellers then had to find the deal in MSX on their own and rebuild the numbers by hand. The answer and the deal record lived in two different places.",who:[["Commercial executives", "start where they already work and land on the right deal, with the plan drafted and the chat still beside them."], ["Sales leads", "review one plan on the deal record, with its assumptions written down, instead of numbers copied out of a chat."]]}],
  ["dec",{n:"Decision 01",h:"How does a chat answer turn into a real deal plan?",opts:"Open the deal in MSX with the chat on the side · a Copilot panel inside the page · a floating “Discuss with Copilot” window",chose:"The plan fills the whole page. When the seller asks a follow-up from a suggested question, the chat opens on the side.",trade:"The plan gets less space while the chat is open. In return, the seller sees the conversation and the numbers together.",why:"When AI lives in a separate tool, sellers go back to their CRM. Putting the agent inside the deal record keeps them there."}],
  ["figs",[["55-89-r","1 · Chat docked alongside"],["55-93-r","2 · Copilot panel in the page"],["55-97-r","3 · Floating window"]],3],
  ["dec",{n:"Decision 02",h:"What should the seller see first?",opts:"Seven layouts that put the plan summary, comparison charts, simulator and product (SKU) table in different orders",chose:"First the agent’s plan and what it assumed. Then a comparison with the last deal. Then the simulator. Then the deal details.",trade:"The detailed product table sits lower on the page, so exact numbers need a scroll."}],
  ["fig","55-121-r","Seven layouts explored before the final order."],
  ["dec",{n:"Decision 03",h:"How does a seller change the agent’s numbers?",opts:"Ask again in the chat · an Edit values form (three versions) · a simulator with sliders (three versions)",chose:"Sliders to try out ideas, each showing the agent’s suggested value underneath, plus Reset and a Range switch. And an Edit values panel for exact numbers, with Regenerate.",trade:"Sliders are quick but not exact, and sellers have to defend their numbers. So exact edits live in a separate panel.",why:"Research shows people are more willing to use an imperfect AI when they can adjust its answer (Dietvorst, Simmons & Massey, 2018)."}],
  ["figs",[["55-179-r","Simulator options: the UAT version, Copilot hints under each slider, and a compact version."],["55-188-r","Edit values options, from UAT to a three-year form with Regenerate."]],2],
  ["dec",{n:"Decision 04",h:"How can the agent suggest other options without taking over?",opts:"Plans as tabs · an “Apply Copilot templates” panel · a separate growth page · a comparison table with changes highlighted",chose:"A panel to compare an option with the current plan. Then a check before anything changes: “Apply option 1? 3 SKUs and 2 discounts will change.” After that, changed values are marked on the page.",trade:"One extra click before any change. In return, it’s clear the seller made the decision, not the AI.",why:"Microsoft’s guidance on over-trusting AI says people should review, edit and confirm AI output before it’s used."}],
  ["fig","55-208-r","Four ways to compare plans."],
  ["demo",{v:"ce/ce-components",n:"02",k:"MSX · Deal components",h:"Change the deal, with Copilot comparing each option",p:"When a seller wants to work on the deal itself, they edit workloads, services and SKUs in one table. Copilot compares an option with the current deal and explains the difference before anything changes.",ch:[[0, "Review the components", "Workloads, services and SKUs in one table, with totals for each part of the deal."], [1.7, "Compare with an option", "Pick an option. Only the SKUs it changes are listed, with a short comparison summary from Copilot."], [6.7, "Apply to the deal", "Apply moves the option into the deal, and a message confirms it worked."], [11.4, "Expand to focus", "Expand hides everything else so the seller can work on the table alone. Collapse brings the page back."]],why:"Sellers try several versions of a deal before they settle on one. Without help, they had to spot by eye which SKUs changed and what that did to the totals.",who:[["Commercial executives", "see only what an option changes, read why it’s recommended, and apply it when they’re ready."], ["Sales leads", "can tell what the seller chose, because nothing changes until the seller presses Apply."]]}],
  ["h3","How the agent behaves: drafts, never decides"],
  ["tbl",["Principle","How the design does it"],[["Realistic expectations","Assumptions listed under every plan; “AI-generated content may be incorrect” on AI answers"],["Signal when to check","A plain-language risk line; badges on SKUs the agent changed"],["Make checking easy","A Sources panel lists the files and data behind the plan"],["Review, edit, confirm","Simulator, Edit values and an explicit Apply on every alternative"],["Feedback","Thumbs and suggested follow-up prompts on every Copilot card"],["Autonomy","Only the seller applies changes or creates a quote"]]],
  ["figs",[["55-266-r","Sources: which files the agent used."],["55-270-r","History: badges mark what changed since the last deal."]],2]
 ]),
 S("impact","03","Impact","What it reached, and how I’d measure it",[
  ["kv",[["Delivered","One end-to-end vision from Teams chat to quote, shown in two demos, with final screens for plan, simulator, edit values, compare and apply, sources and history."],["Explored","3 navigation patterns · 7 page layouts · 3 + 3 simulator and edit designs · 4 compare-and-apply patterns"],["Same direction","Two days after the first demo, Microsoft announced Sales Chat in Microsoft 365 Copilot: an agent that turns CRM data into plans to close specific deals."]]],
  ["h3","How I’d measure it next"],
  ["tbl",["Signal","Metric","Why it matters"],[["Time","Time to build a renewal plan vs today","The job takes a large share of a seller’s month"],["Adoption","Share of renewals started from an agent-drafted plan","Shows the agent earned a place in the workflow"],["Trust","Values kept, edited or regenerated; Sources opens","Separates healthy checking from blind acceptance"],["Quality","Deals approved within discount guidelines","Faster plans should also be sound plans"]]]
 ])],
 refl:"The decision I’d defend in any room is the explicit Apply step: an agent that drafts money decisions should never make them. Next I’d put the simulator in front of five sellers and design the states that matter most for trust: missing data, low confidence, and when the agent should decline to propose.",
 src:["Dietvorst, Simmons & Massey, “Overcoming algorithm aversion”, Management Science, 2018","Microsoft Learn, “Overreliance on AI”, 2025","Amershi et al., “Guidelines for Human-AI Interaction”, CHI 2019","Spataro, “New sales agents in Microsoft 365 Copilot”, Mar 2025"]},
