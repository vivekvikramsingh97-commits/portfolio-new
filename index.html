{id:"mdm-copilot",tier:1,nda:true,name:"MDM Copilot",year:"2024–2025",cat:"Copilot · Microsoft (contract)",
 short:"A copilot that knows when to interrupt",thumb:"8-159-r",hero:"42-12-r",
 title:"A copilot that tells renewal sellers what needs them today, and stays quiet otherwise",
 lede:"I designed how Copilot shows up in ESXP Quote Management, where Microsoft Unified sellers build renewal quotes: what it surfaces, when it speaks up, and how much it may do on its own.",
 meta:[["Role","Product designer, Copilot experience"],["Team","Microsoft design studio with the ESXP PMs"],["Timeline","Dec 2024 – Jan 2025"],["Users","Unified sellers and deal managers"],["Product","ESXP Quote Management"],["Type","New AI capability in an existing product"]],
 ov:[["Identify","Renewal work was spread across tools and found late. Copilot had to bring it to sellers inside the quote list they already open."],["Iterate","A four-mode interaction model, four placements, three card designs and two PM reviews narrowed Copilot to one panel that suggests and never edits a quote on its own."],["Impact","Phase 1 delivered in two months: the model, 7 scenarios, empty and failure states, a prototype and a Copilot component kit."]],
 secs:[
 S("identify","01","Identify","Who struggled with what, and why it mattered",[
  ["h3","Context"],
  ["p","Microsoft Unified is Microsoft’s enterprise support contract, priced as a share of a customer’s Microsoft spend and trued up each year. Every renewal quote depends on current usage, risk and pricing. Sellers pulled last year’s services, contracts, meeting notes and risk signals from several tools, often close to the deadline."],
  ["p","The ESXP team set four goals for Copilot: grow revenue through offering recommendations and renewal-risk discovery, automate renewal quotes, coach sellers on deals, and scope zero-touch contracting. Phase 1 started with growth and renewal."],
  ["h3","Where the work lived"],
  ["tbl",["Job","Pain points from PM walkthroughs"],[["Grow an account","Switch tools to see where an account can grow · re-read past meeting notes · agree financials with other sellers · edit packages by hand"],["Renew a contract","Switch tools to discover renewal risk · compare contracts to judge renewal · copy last year’s services · check a separate app for status"],["Close the deal","Recreate the contract shell each renewal · look back at past engagements · track approvals by hand"]]],
  ["fig","42-115-r","I mapped the existing quote and contract flows screen by screen before proposing anything."],
  ["q","How might Copilot bring the day’s renewal work to sellers, inside the quote list they already use, without becoming one more inbox?"],
  ["kv",[["Known",["The PMs’ four goals and the Phase 1 scope","Seven signals behind renewal propensity: usage, consumption, satisfaction, adoption, relationship, discounts, proactive engagement","The studio’s Copilot patterns: drawers, modals, immersive views"]],["Assumed",["Sellers start their day on the Quotes list","A suggestion is trusted more when its reasons are visible","A few grouped alerts beat many single ones"]],["Constraints",["A six-week design sprint","Studio Copilot patterns and the existing ESXP layout","Insights limited to data ESXP could already reach"]]]]
 ]),
 S("iterate","02","Iterate","Principles first, then a decision every week",[
  ["h3","How the two months ran"],
  ["tbl",["Week","Work","Outcome"],[["W1","Q&A with PMs, walkthrough of the quote space","Scenarios identified"],["W2","Design approach, jobs to be done, IA","Success metrics defined"],["W3","Task flows, story freeze","Low-fi wireframes"],["W4","Detailing agreed screens","PM review of low-fi"],["W5–6","High fidelity, packaging, prototype","PM review of hi-fi; first prototype"],["24 Jan","Scenario review","Changes requested"],["31 Jan","Final Phase 1 scenarios","Handover"]]],
  ["h3","Principles I set before any screens"],
  ["tbl",["Principle","Meaning"],[["Plan the seller’s day","Sort Copilot’s work into Updates, Now and Upcoming"],["Right information, time and place","Surface what helps a decision, where it happens"],["Live inside familiar tools","Embed Copilot in known screens; go immersive only on demand"],["Help them act","Every insight leads to a next step"]]],
  ["h3","The model that framed every decision"],
  ["tbl",["Mode","Who starts, who acts","Phase"],[["Proactive","Copilot starts; surfaces the right data at the right time","Phase 1"],["Reactive","Seller asks; Copilot answers","Phase 1"],["Agentic","Seller delegates tasks Copilot does on its own","Later"],["Assistive","Copilot works on a task alongside the seller","Later"]]],
  ["note","Written in week 2 and shared with PMs and engineers. Phase 1 used only the modes where the seller stays in control of every change."],
  ["dec",{n:"Decision 01",h:"Where should Copilot show up?",opts:"A panel on the Quotes dashboard · a pop-up summary for each customer · a full-page review with chat · a drawer inside a quote",chose:"A panel on the dashboard for the day’s work, and a drawer for help inside a single quote. Each alert opens its own card.",trade:"We gave up the full-page view and its chat. It asked sellers to learn a new way of working, so it’s saved for later.",why:"Interruptions are less annoying when they come at natural breaks (Iqbal & Bailey, CHI 2008). A panel sellers check when they arrive avoids pop-ups in the middle of a task."}],
  ["figs",[["43-131-r","A · Dashboard panel"],["43-135-r","B · Pop-up customer summary"],["43-140-r","C · Immersive review with chat"],["43-144-r","D · Drawer inside a quote"]],2],
  ["fig","43-148","Low-fidelity wireframes from week 3: Teams trigger, dashboard, single-quote view and drawer."],
  ["dec",{n:"Decision 02",h:"How much can Copilot do from a dashboard card?",opts:"An “Add” button that applies the suggestion in one click · two “View” buttons · one “View” button that opens a card",chose:"One View button. The card explains the suggestion. The change itself happens inside the quote, where the seller sees the price, margin and discount before saying yes.",trade:"Every accepted suggestion takes one more step.",why:"Microsoft’s Human-AI guidelines say to show what an action will change (G16) and to do less when unsure (G10)."}],
  ["figs",[["43-169-r","Option 1 · one-click Add"],["43-173-r","Option 2 · two View actions"],["43-177-r","Option 3 · one View (chosen)"]],3],
  ["dec",{n:"Decision 03",h:"What deserves a spot on the dashboard?",opts:"One card for every customer and event · cards grouped by type, showing only what needs this seller’s decision",chose:"Cards grouped by type. We agreed this at the 24 January review.",trade:"Less detail on the dashboard. Sellers open a card to see which customers it covers."}],
  ["figs",[["43-195-r","24 January review"],["43-199-r","31 January final"]],2],
  ["tbl",["24 January","31 January"],[["Growth for one customer, with a bare percentage","Growth possibility for 3 customers, explained by solution area"],["Propensity drop under Updates","Moved to Now, because it needs action"],["An email-based “urgent attention” card","Removed: it duplicated Outlook and sat outside quote data"],["No failure state","“Renewal quotes could not be created” shown as a warning"]]],
  ["h3","Seven scenarios, no dead ends"],
  ["fig","43-307-r","One scenario end to end: dashboard, focused alert, then the quote with Copilot alongside."],
  ["figs",[["43-312-r","Renewal quotes now available"],["43-320-r","Renewal quotes could not be created"],["43-338-r","Drawer recommendations in a single quote"],["43-347-r","All caught up: nothing needs you"]],2],
  ["fig","43-355-r","Edge cases documented for engineering: scrolling, empty states and smaller screens."],
  ["h3","Designed against Microsoft’s AI guidelines"],
  ["tbl",["Guideline","How the design does it"],[["G3 · Time services on context","Updates, Now and Upcoming sort work by urgency"],["G8 · Efficient dismissal","Every card dismisses in one click"],["G11 · Explain why","Propensity alerts show the factors behind each change"],["G16 · Convey consequences","Changes happen inside the quote, after review"],["Honest about failure","Failures are alerts; “All caught up” covers quiet days"]]]
 ]),
 S("impact","03","Impact","Delivered, and how I’d measure it",[
  ["kv",[["Delivered","Interaction model, 7 alert and drawer scenarios, 2 empty states, a guided prototype and a component repository with best practices."],["Defined","Success metrics in week 2: task success, time on task, error rate, SUS, click-through and conversion."],["Later evidence","Microsoft reported Copilot use in its sales platform grew sharply once prompts sat inside screens sellers already used, the bet this design made."]]],
  ["h3","How I’d measure it next"],
  ["tbl",["Signal","Metric"],[["Adoption","Share of sellers who open a Copilot card each week"],["Task success","Renewal quotes reviewed before the deadline"],["Time","Time from “quote ready” alert to quote reviewed"],["Trust","Accept vs dismiss rate per alert type"],["Errors","Time to fix a failed quote after the alert"]]]
 ])],

{id:"advanced-hunting",tier:1,name:"WatchTower · Advanced Hunting",year:"1 month",cat:"Security analytics · Interaction designer",
 short:"Two threat-hunting tools, one workflow",thumb:"29-14",hero:"25-220",
 title:"Bringing two threat-hunting tools together, so analysts stop switching",
 lede:"WatchTower, a stand-in name for an enterprise security suite, had two ways to hunt email threats: Advanced Hunting, a query tool for experts, and Threat Explorer, a filter-based view. I redesigned Advanced Hunting to combine the best of both.",
 meta:[["Role","Interaction designer"],["Research","Usage data; interviews with PMs and a product designer"],["Timeline","1 month"],["Users","Security analysts, novice to senior"],["Tools","Figma, Photoshop, Illustrator"],["Type","Research-led redesign"]],
 ov:[["Identify","Hunters were confused between the two tools for phishing and spam, which slowed them down and put organisations at risk."],["Iterate","Step-by-step comparison, three personas, seven opportunity areas, then three decisions about one shared screen."],["Impact","A proposed Advanced Hunting with charts by default, results by workload, accumulated views and bulk actions."]],
 secs:[
 S("identify","01","Identify","Two tools, overlapping users, different strengths",[
  ["q","Threat hunters get confused between Advanced Hunting and Threat Explorer for email phishing and spam, which slows them down and puts the organisation at risk."],
  ["fig","25-245","The two existing experiences: Advanced Hunting (query-based) and Threat Explorer (filter-based)."],
  ["h3","Research"],
  ["p","I compared both experiences step by step, built three personas (a threat intelligence analyst, a threat hunter and an incident response manager), and combined usage data with interviews."],
  ["ul",["Explorer reached far more tenants, but Advanced Hunting ran more queries, mostly through its API.","Many tenants use both tools, and email is one of the most hunted data sets.","Explorer’s filters and graph view are easy; Advanced Hunting needs KQL and schema knowledge.","Advanced Hunting runs several queries in tabs; Explorer runs one at a time.","Explorer offers more remediation actions, and the tools use different data sources."]],
  ["fig","25-270","Side-by-side comparison: licences, users, query style, flows and remediation actions."]
 ]),
 S("iterate","02","Iterate","Three decisions behind the redesign",[
  ["dec",{n:"Decision 01",h:"Merge the two tools, or improve one?",opts:"Seven areas we could work on: one platform, an easier start in Advanced Hunting, more ways to fix threats, the same data in both tools, keeping what Explorer does well, API use, and email limits",chose:"Take what Explorer does well (charts, grouped views, acting on many items at once) and bring it into Advanced Hunting.",trade:"Making the data match in both tools was left out. It needs engineering work that design can’t solve."}],
  ["fig","25-299","Opportunity areas from the research."],
  ["dec",{n:"Decision 02",h:"How can beginners and experts use the same screen?",opts:"Keep the expert table only · add a separate simple mode · one view with charts by default and the table one click away",chose:"One view. It shows live activity and charts by default, splits results by source (email, devices, identity, cloud apps), and has a switch to the table.",trade:"Experts get a busier default screen, but their familiar table is still there."}],
  ["fig","25-316","The proposed Advanced Hunting: visualisation, workload tabs, accumulated results and bulk actions."],
  ["dec",{n:"Decision 03",h:"How do analysts act on what they find?",opts:"Fix one result at a time · select many and fix them together",chose:"Fix many at once. Extra tabs (link clicks, top links, top clicks) help analysts sort results faster.",trade:"A wrong bulk fix hits many mailboxes at once, so it needs a clear confirmation step."}],
  ["fig","25-333","Current vs proposed experience."]
 ]),
 S("impact","03","Impact","Outcome",[
  ["kv",[["Delivered","Research, opportunity areas and a proposed Advanced Hunting experience, in one month."],["Next","Test time to triage a phishing campaign, current vs proposed."]]]
 ])],
 refl:"The usage data changed the brief: people weren’t choosing one tool over the other. They were using both, and paying for the gap."},

{id:"crestos",tier:1,name:"CrestOS",year:"2026",cat:"AI-native SaaS, 0 to 1 · Product and brand designer",
 short:"An SEO suite where AI suggests and people decide",thumb:"8-148",hero:"6-9",
 title:"A 0-to-1 SEO suite where AI suggests, and people decide what goes live",

 meta:[["Role","Product and brand designer, end to end"],["Client","Client project, redesigning an existing build"],["Timeline","9 Oct – 10 Nov 2026"],["Platform","Web app, 1920 × 1080 base"],["Status","In progress · design system v0.1"],["Type","0 to 1"]],
 ov:[["Identify","Agencies juggle many sites across separate tools for content, local SEO, analytics and fixes, and plain AI writing is generic and makes things up."],["Iterate","Mapped the old build from recordings, studied competitors per job, agreed the flow, then explored components as option sets."],["Impact","On-page module designed end to end; a 72-token design system, light and dark; brand and landing page."]],
 secs:[
 S("identify","01","Identify","SEO issues pile up quietly",[
  ["p","An agency has to produce a lot of content for many clients, fast, while keeping every piece on-brand, correct and checked by a person. Ten articles are manageable; three hundred across eight clients are not, and nobody knows what is stuck."],
  ["q","How might an agency see which client needs attention, and apply AI fixes at scale, without anything going live unchecked?"],
  ["kv",[["Constraints",["Several modules (On-page, Content Engine, Knowledge Bases, Brand Kits) had to feel like one product","Dense data: often 15+ workflows per client","AI output must never publish on its own","A five-week sprint with fixed milestones"]],["Inputs","Daily knowledge-transfer sessions with the client; a staging build mapped from screen recordings."]]]
 ]),
 S("iterate","02","Iterate","Agree the flow, then explore components side by side",[
  ["p","I studied competitors for each job (AirOps for content, Merchynt Paige for local SEO, AgencyAnalytics for analytics), tested five brand personalities before choosing “precise, calm, dependable”, and agreed the flow before drawing UI: all clients → one client → Overview, Issues, Fix queue."],
  ["fig","6-61","Option sets for stat cards and run cards. Runs are what people check most, so they got the most iterations."],
  ["dec",{n:"Decision 01",h:"How does someone switch between 30 clients without getting lost?",opts:"A client dropdown on every screen · a list of all clients, then one client at a time with tabs",chose:"A list of clients ranked by health score. Each client opens with three tabs: Overview, Issues and Fix queue.",trade:"Switching clients takes one more click. In return, you always know which client you’re looking at."}],
  ["fig","6-81","Client overview: health score, errors, warnings and AI fixes ready, with issues grouped by topic."],
  ["dec",{n:"Decision 02",h:"Where do AI fixes wait before they go on a live website?",opts:"Apply them automatically when the AI is confident · show suggestions next to each issue · a Fix queue where a person checks and applies them",chose:"A Fix queue. Suggestions appear next to each issue, then go into the queue. Nothing goes live until a person applies it.",trade:"Slower than applying automatically. But agencies stay in control of their clients’ sites and can review fixes in batches."}],
  ["figs",[["6-98","Issues: problems grouped by topic, each with a suggested fix."],["6-101","Fix queue: AI suggestions wait for review and approval."]],2],
  ["dec",{n:"Decision 03",h:"Show workflows as cards or as a table?",opts:"Cards that explain each step · a more compact table",chose:"We tried both. Cards are easier for new users to understand. The table works better once there are more than about 15 workflows.",trade:"Easy to read versus fitting more on screen."}],
  ["figs",[["6-118","Option A: workflows as cards with pipeline chips."],["6-121","Option B: workflows as a denser table."]],2],
  ["h3","Rules for an AI that edits other people’s websites"],
  ["tbl",["Rule","How"],[["Suggest, never publish","AI drafts fixes and content; publishing needs a person"],["Batch review","Fix queue with panels to inspect each suggestion"],["A visual language for AI","The gradient is reserved for AI moments only"],["Visible progress","Generating a brand kit spent about 8 of 12 minutes loading in the old build, so long AI jobs show progress"]]],
  ["fig","6-168","Brand Kit: each brand gets a kit built from its website, so AI content stays on-brand."]
 ]),
 S("impact","03","Impact","Where it stands",[
  ["kv",[["Delivered","On-page module end to end; design system v0.1 with 72 tokens, light and dark themes; brand and landing page."],["In progress","Content Engine, Knowledge Bases and Brand Kits."],["Next","Test the client list and Fix queue with agency users; measure time from issue found to fix applied, and AI fixes accepted without edits."]]]
 ])],
 refl:"Owning the brand, the system and the product at once meant every decision could be consistent, and also that nobody was there to push back. The next step is putting it in front of real agency teams before the remaining modules harden."},

{id:"cipherstar",tier:2,name:"CipherStar",year:"1 month",cat:"Email security AI · Interaction designer",
 short:"An AI assistant that explains phishing before you click",thumb:"29-3",hero:"25-10",
 title:"Helping people spot phishing before they click, with an AI that explains the risk",
 lede:"CipherStar, a working name, reimagines email security inside the inbox: a vulnerability score on suspicious emails, an AI side panel that explains threats, alerts before a risky link opens, and an overview of what it caught.",
 meta:[["Role","Interaction designer"],["Research","Survey of 261 security admins and end users"],["Timeline","1 month"],["Platform","Desktop email client and browser"],["Status","MVP scope defined"],["Type","Research-led concept"]],
 ov:[["Identify","Safety tips existed, but people didn’t notice, understand or trust them."],["Iterate","261 survey responses, three personas, a brainstorm with PMs, designers and CX, then small experiments before committing to four features."],["Impact","A defined MVP: a subtle cue, an AI alert, browser protection and an investigation panel."]],
 secs:[
 S("identify","01","Identify","261 participants, three personas, thirteen problems",[
  ["q","How might we make email security noticeable, understandable and trusted, without adding to alert fatigue?"],
  ["ul",["Telling legitimate from malicious email was the most common challenge (164 responses).","155 people can only sometimes identify malicious emails; 28 can almost always.","Confidence in handling security challenges is moderate (NPS 33).","Training (132) and reporting tools (100) are the biggest blockers to reporting.","Proactive alerting before an attack was rated the most helpful solution."]],
  ["figs",[["25-62","Personas: Tech-Savvy Sam, Proactive Penny and Casual Cathy."],["25-66","Key takeaways from the survey."]],2]
 ]),
 S("iterate","02","Iterate","From brainstorm to small experiments",[
  ["figs",[["25-74","Brainstorm and user flow for a suspicious email."],["25-78","What the assistant does at each step."]],2],
  ["dec",{n:"Decision 01",h:"How do you make a safety warning easy to notice without scaring people?",opts:"The existing banner · a colour-coded label · a risk score with a one-line reason and buttons to act",chose:"A risk meter with a short reason, Report and Block buttons, and Analyse to see full details in a side panel.",trade:"A number can look more exact than it is. So it always comes with a reason and a way to see more."}],
  ["fig","25-99","Enhanced safety tips: score, reason, actions, and automatic tags."],
  ["dec",{n:"Decision 02",h:"Wait for people to ask, or warn them at the risky moment?",opts:"A chat assistant people open when worried · automatic alerts only · both, with alerts only for high risk",chose:"Both. An alert shows up when someone hovers over a suspicious link or opens a known bad site. Everything else waits in the chat.",trade:"Too many alerts make people ignore them, so alerts only appear at the moment of real risk."}],
  ["figs",[["25-117","Proactive alerting on a risky link."],["25-121","The chat assistant: Summarise, Analyse and Smart reply."]],2],
  ["dec",{n:"Decision 03",h:"What’s the smallest version worth building first?",opts:"All four features at once · a small first version that grows",chose:"A small first version: a simple marker for suspicious or safe email, an AI alert with suggested actions, browser protection, and a side panel to investigate.",trade:"The overview screen waits for later. In return, the team could actually build the first release."}],
  ["fig","25-138","The four MVP moments."],
  ["fig","25-185","AI overview: unread, urgent and unsafe emails at a glance."]
 ]),
 S("impact","03","Impact","Outcome",[["kv",[["Delivered","Research with 261 participants turned into four features and a defined MVP in one month."],["Next","Test whether the score and reason change behaviour: fewer risky clicks, more reports."]]]])],

        :k==="probs"?`<ol class="ev-pr">${g.probs.map(([ic,h,e,r])=>`<li><span class="ev-ic" aria-hidden="true">${ICON[ic]||""}</span><div><p class="ev-h">${esc(h)}</p><span>${md(e)}</span><p class="ev-r"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h9M7.5 3.5 11 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>${esc(r)}</p></div></li>`).join("")}</ol>`
        :k==="comp"?`<ul class="ev-co">${g.comp.map(w=>`<li>${BRANDS[w]?`<i style="--m:url(&quot;${BRANDS[w]}&quot;)" aria-hidden="true"></i>`:`<i class="mono" aria-hidden="true">${esc(w[0])}</i>`}${esc(w)}</li>`).join("")}</ul>`
        :`<p class="ev-bar">${md(g.bar)}</p>`;
      return `<div class="ev full rv" role="table" aria-label="How ZBrain changed from Gen 1 to Gen 3">
        <div class="ev-c ev-corner" style="--r:1;--c:1"></div>
        ${G.map((g,i)=>`<div class="ev-c ev-hd" role="columnheader" style="--r:1;--c:${i+2};--o:${i*10}"><div class="ev-n"><span class="mk-g">${esc(g.n)}</span><b>${esc(g.t)}</b></div><small>${g.g?esc(g.g)+" · ":""}${esc(g.d)}</small>${i<G.length-1?`<span class="ev-to" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M2 7h9M7.5 3.5 11 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span>`:""}</div>`).join("")}
        ${rows.map(([k,l],r)=>`<div class="ev-c ev-lab" role="rowheader" style="--r:${r+2};--c:1">${esc(l)}</div>${G.map((g,i)=>`<div class="ev-c evk-${k}" role="cell" data-l="${esc(l)}" style="--r:${r+2};--c:${i+2};--o:${i*10+r+1}">${cell(g,k)}</div>`).join("")}`).join("")}
      </div>`; }
    case "pgen": { const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
      return `<div class="pg full">${a[0].map(g=>`<section class="pg-g rv"><header class="pg-h"><div class="pg-gn"><span class="mk-g">${esc(g.g.split(" · ")[1]||"")}</span><small>${esc(g.g.split(" · ")[0])}</small></div><p class="pg-wl">Why it had to change</p>
        <ul class="pg-why">${g.why.map(([b,t])=>`<li><b>${esc(b)}</b> ${md(t)}</li>`).join("")}</ul></header>
        <ol class="pg-list">${g.rows.map(([ic,h,e,r])=>`<li><span class="zc-ic" aria-hidden="true">${ICON[ic]||""}</span><div class="pg-p"><b>${esc(h)}</b><span>${md(e)}</span></div>
          <svg class="pg-ar" viewBox="0 0 20 12" aria-hidden="true"><path d="M1 6h17M13 1.5 18 6l-5 4.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <div class="pg-r"><small>Design response</small><b>${esc(r)}</b></div></li>`).join("")}</ol></section>`).join("")}</div>`; }
    case "mkt": { const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
      return `<div class="mk full">${a[0].map(m=>`<div class="mk-c rv"><div class="mk-top"><span class="mk-g">${esc(m.g)}</span><b>${esc(m.cat)}</b></div>
        <ul class="mk-who">${m.who.map(w=>`<li>${esc(w)}</li>`).join("")}</ul><p>${md(m.p)}</p></div>`).join("")}</div>`; }
    case "mini": return `<div class="mini c${Math.min(3,a[0].length)} full">${a[0].map(([b,r])=>`<div class="rv"><small>Decision</small><p><b>${esc(b)}</b> ${esc(r)}</p></div>`).join("")}</div>`;
    case "gprob": return `<ol class="gp full c${a[0].length}">${a[0].map(x=>`<li class="rv"><span class="gp-ic" aria-hidden="true">${ICON[x.ic]||""}</span><h5>${esc(x.h)}</h5><p class="gp-e"><small>What we saw</small>${esc(x.e)}</p><p class="gp-r"><small>What it did</small>${esc(x.r)}</p></li>`).join("")}</ol>`;
    case "gdir": { const o=a[0]; return `<div class="gd full rv"><ul class="gd-why">${o.why.map(([b,t])=>`<li><b>${esc(b)}</b> ${esc(t)}</li>`).join("")}</ul><dl class="gd-side"><div><dt>Benchmarked against</dt><dd><ul class="ev-co">${o.comp.map(w=>`<li>${BRANDS[w]?`<i style="--m:url(&quot;${BRANDS[w]}&quot;)" aria-hidden="true"></i>`:`<i class="mono" aria-hidden="true">${esc(w[0])}</i>`}${esc(w)}</li>`).join("")}</ul></dd></div><div><dt>The bar to clear</dt><dd class="gd-bar">${esc(o.bar)}</dd></div></dl></div>`; }
    case "done": return `<p class="done rv"><b>${esc(a[0])}</b> ${esc(a[1])}</p>`;
    case "nums": return `<dl class="proof cstats nums full">${a[0].map(([n,l,src])=>`<div><dt>${esc(n)}</dt><dd>${esc(l)}${src?`<small>${esc(src)}</small>`:""}</dd></div>`).join("")}</dl>`;
    case "jobs": return a[0].map(([l,figs])=>`<div class="jobs full"><h5>${esc(l)}</h5><div class="figs c3">${figs.map(([f,c])=>figure(f,c,pid,true)).join("")}</div></div>`).join("");
    case "fig": return figure(a[0],a[1],pid,false);
    case "demo":{const d=a[0];return `<div class="dm full" data-dm>
<div class="dm-h rv"><small><span>${esc(d.n)}</span>${esc(d.k)}</small><div><h5>${esc(d.h)}</h5><p>${esc(d.p)}</p></div></div>
<div class="dm-v stage th-${THEME[pid]||"stone"} rv-img"><div class="win"><div class="bar"><i></i><i></i><i></i><u></u></div><div class="dm-f"><video muted loop playsinline preload="none" poster="${d.v}.webp" data-src="${d.v}.mp4" aria-label="${esc(d.h)}"></video><button class="dm-fs" type="button" aria-label="Full screen"><i></i></button><button class="dm-pp" type="button" aria-label="Pause"><i></i></button></div></div></div>
<ol class="dm-ch" style="--n:${d.ch.length}">${d.ch.map(([t,h,c],i)=>`<li><button type="button" data-t="${t}"><u><b></b></u><span><em>${String(i+1).padStart(2,"0")}</em>${esc(h)}</span><small>${esc(c)}</small></button></li>`).join("")}</ol>${d.why?`<div class="dm-x rv"><div><h6>Why it was needed</h6><p>${esc(d.why)}</p></div><div><h6>How it helps</h6><ul>${d.who.map(([r,t])=>`<li><b>${esc(r)}</b><span>${esc(t)}</span></li>`).join("")}</ul></div></div>`:""}</div>`;}
    case "figs": return `<div class="figs c${a[1]||2} full">${a[0].map(([f,c])=>figure(f,c,pid,true)).join("")}</div>`;
  } return "";
}

function card(p,cls){
  const cover=COVER(p.id)||p.thumb, kind=(p.cat||"").split(" · ")[0], lg=(cls||"").includes("lg");
  return `<a class="wk ${cls||""}" href="#${p.id}" data-g="${grp(p)}"><div class="im rv-img"><img src="${IMG(cover)}" alt="${esc(p.name)}" loading="${lg?"eager":"lazy"}" decoding="async">${STATUS[p.id]?`<span class="tag st">${STATUS[p.id]}</span>`:""}${p.nda?'<span class="tag nda">NDA</span>':""}</div>
   <div class="t"><span>${esc(p.name)}</span><em>${esc(p.year||"")}</em></div>${lg&&p.short?`<p class="sh">${esc(p.short)}</p>`:""}<div class="c">${esc(ORG[p.id]?ORG[p.id]+" · "+kind:kind)}</div></a>`;
}

function navFill(){
  const main=[["#top","Home"],["#work","AI products","Work"],["#principles","Principles"],["#approach","Approach"],["#about","About"],["#contact","Contact"]];
  document.querySelectorAll(".ncol.a").forEach(n=>n.innerHTML=main.map(([h,t,sh])=>`<a href="${h}">${sh?`<span class="lf">${roll(t)}</span><span class="ls">${roll(sh)}</span>`:roll(t)}</a>`).join(""));
  const tn=document.querySelector(".top .ncol.a");

}

function aboutPage(){
  const fig=(cls,src,w,h,alt,cap,eager)=>`<figure class="pc ${cls}"><img src="about/${src}.webp" alt="${alt}" width="${w}" height="${h}" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async"><figcaption>${cap}</figcaption></figure>`;
  return `<article class="abp wrap">
   <div class="crumb"><a href="#top">Home</a><i></i>About</div>
   <h1>Off the clock.</h1>
   <p class="tagline">Running, old places and long stories.</p>
   <div class="collage">
    ${fig("c1","portrait",1200,1500,"Vivek Vikram Singh in a white shirt against a deep red wall in Montmartre","Montmartre, Paris",true)}
    ${fig("c2","jaipur",800,1000,"Vivek smiling outside the Hawa Mahal in Jaipur at night","Hawa Mahal, Jaipur",true)}
    ${fig("c3","anime",800,1000,"Vivek wearing an anime-inspired cowboy hat","Anime, worn proudly")}
    ${fig("c4","montmartre",800,1000,"Vivek in Montmartre with the Sacré-Cœur behind him","Sacré-Cœur, on a grey morning")}
   </div>
   <div class="row12 about abt">
    <h2 class="lbl">/About.</h2>
    <div class="body">
     <p class="stmt rv">Away from the screen, I’m usually on a run, inside an old fort, or a few episodes deeper into something I promised to only start.</p>
     <div class="ab-lead">
      <p class="rv">I grew up in Lucknow, a city that wears its history in plain sight, and studied design at NID in Kurukshetra, a town that is mostly history. Both left me with the same habit: before I change something, I want to know where it came from.</p>
      <p class="rv">That habit runs through my work. Today I design enterprise AI at The Hackett Group. Before that, copilots and AI agents for Microsoft, and before that, brand and communication at QGLUE. The medium keeps changing. The question doesn’t: what does this person need to understand before they decide?</p>
     </div>
    </div>
   </div>

   <div class="row12 about abt2">
    <h2 class="lbl">/What I’m into.</h2>
    <div class="body">
     <div class="ab-i">
      <div class="rv"><i>01</i><h4>Run</h4>
       <p>Running is the one hour of my day with no screen and no agenda. Problems that won’t move at a desk tend to settle somewhere along the route.</p>
       <p>It has also taught me something I use in design: steady, repeatable effort beats one heroic sprint. Good design systems are built the same way.</p>
       <a class="ab-l" href="#" data-ext="strava">Strava <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9.5 2.5M4 2.5h5.5V8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a></div>
      <div class="rv"><i>02</i><h4>Explore</h4>
       <p>I travel for historical places: forts, havelis, old markets, from Jaipur’s Hawa Mahal to the lanes of Montmartre. I go for the architecture and stay for the stories nobody wrote on the plaque.</p>
       <p class="ab-s"><span>In my work</span><a href="#ranbhoomi">Ranbhoomi Kurukshetra</a>, a Mahabharata strategy game where we checked every weapon against textual and visual archives, and the Maharashtra Police exhibition in Gadchiroli, built around traditional art forms.</p></div>
      <div class="rv"><i>03</i><h4>Watch &amp; read</h4>
       <p>Pop history, books, films and anime. I’m a cinephile at heart, and long stories with good world-building are my favourite kind of research. They teach you how people make sense of a complicated system, which is most of what designing AI is.</p>

const lbSt=lb.querySelector(".lbst"), lbImg=lbSt.querySelector("img"), lbPct=lb.querySelector(".lbctl span");
let lastFocus=null, Z={nw:1,nh:1,fit:1,s:1,tx:0,ty:0};
const lbMax=()=>Math.max(Z.fit*8,4);
function lbApply(){ lbImg.style.transform=`translate(${Z.tx}px,${Z.ty}px) scale(${Z.s})`; lbPct.textContent=Math.round(Z.s/Z.fit*100)+"%"; lbSt.classList.toggle("zoomed",Z.s>Z.fit*1.01); }
function lbClamp(){ const r=lbSt.getBoundingClientRect(), w=Z.nw*Z.s, h=Z.nh*Z.s;
  Z.tx = w<=r.width ? (r.width-w)/2 : Math.min(0,Math.max(r.width-w,Z.tx));
  Z.ty = h<=r.height ? (r.height-h)/2 : Math.min(0,Math.max(r.height-h,Z.ty)); }
function lbZoomAt(ns,cx,cy,anim){ ns=Math.min(lbMax(),Math.max(Z.fit,ns)); Z.tx=cx-(cx-Z.tx)*ns/Z.s; Z.ty=cy-(cy-Z.ty)*ns/Z.s; Z.s=ns; lbClamp(); lbSt.classList.toggle("anim",!!anim); lbApply(); }
function lbFit(anim){ const r=lbSt.getBoundingClientRect(), pad=r.width<700?12:32; const rel=Z.s/Z.fit||1;
  Z.fit=Math.min((r.width-pad*2)/Z.nw,(r.height-pad*2)/Z.nh); Z.s=Z.fit*(anim==="keep"?rel:1); lbClamp(); lbSt.classList.toggle("anim",anim===true); lbApply(); }
const lbMid=()=>{ const r=lbSt.getBoundingClientRect(); return [r.width/2,r.height/2]; };
function openLb(src,cap){ lastFocus=document.activeElement; lb.querySelector(".lbbar p").textContent=cap; lbImg.alt=cap; lb.hidden=false;
  document.documentElement.style.overflow="hidden"; if(lenis) lenis.stop();
  const ready=()=>{ Z.nw=lbImg.naturalWidth||1600; Z.nh=lbImg.naturalHeight||900; Z.s=0; lbFit(false); };
  lbImg.onload=ready; lbImg.src=src; if(lbImg.complete&&lbImg.naturalWidth) ready();
  lb.querySelector(".lbx").focus(); }
function closeLb(){ lb.hidden=true; document.documentElement.style.overflow=""; if(lenis) lenis.start(); if(lastFocus) lastFocus.focus(); }
lb.querySelector(".lbx").addEventListener("click",closeLb);
lb.querySelector(".lbctl").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; const [cx,cy]=lbMid();
  if(b.dataset.z==="in") lbZoomAt(Z.s*1.6,cx,cy,true); else if(b.dataset.z==="out") lbZoomAt(Z.s/1.6,cx,cy,true); else lbFit(true); });
lbSt.addEventListener("wheel",e=>{ e.preventDefault(); const r=lbSt.getBoundingClientRect();
  if(!e.ctrlKey && Z.s>Z.fit*1.01 && Math.abs(e.deltaX)>Math.abs(e.deltaY)*0.6){ Z.tx-=e.deltaX; Z.ty-=e.deltaY; lbClamp(); lbSt.classList.remove("anim"); lbApply(); return; }
  lbZoomAt(Z.s*Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0022)),e.clientX-r.left,e.clientY-r.top,false); },{passive:false});
/* pointers: one drags, two pinch; a quick double tap toggles fit and 3×; a tap beside the image at fit closes */
const LBP=new Map(); let pinch=null, drag=null, lastTap=0, moved=false;
lbSt.addEventListener("pointerdown",e=>{ lbSt.setPointerCapture(e.pointerId); LBP.set(e.pointerId,[e.clientX,e.clientY]); moved=false; lbSt.classList.remove("anim");
  if(LBP.size===2){ const [a,b]=[...LBP.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:Z.s}; drag=null; }
  else if(LBP.size===1){ drag={x:e.clientX,y:e.clientY,tx:Z.tx,ty:Z.ty}; lbSt.classList.add("drag"); } });
lbSt.addEventListener("pointermove",e=>{ if(!LBP.has(e.pointerId)) return; LBP.set(e.pointerId,[e.clientX,e.clientY]); const r=lbSt.getBoundingClientRect();
  if(pinch&&LBP.size>=2){ const [a,b]=[...LBP.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); moved=true;
    lbZoomAt(pinch.s*d/pinch.d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,false); }
  else if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    if(Z.s>Z.fit*1.01){ Z.tx=drag.tx+dx; Z.ty=drag.ty+dy; lbClamp(); lbApply(); } } });
const lbUp=e=>{ if(!LBP.has(e.pointerId)) return; LBP.delete(e.pointerId); lbSt.classList.remove("drag");
  if(LBP.size<2) pinch=null;
  if(LBP.size===1){ const [p]=[...LBP.values()]; drag={x:p[0],y:p[1],tx:Z.tx,ty:Z.ty}; return; }
  drag=null; if(moved||e.type==="pointercancel") return;
  const r=lbSt.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, now=performance.now();
  const ir=lbImg.getBoundingClientRect(), onImg=e.clientX>=ir.left&&e.clientX<=ir.right&&e.clientY>=ir.top&&e.clientY<=ir.bottom;
  if(e.pointerType==="mouse"){ const zoomed=Z.s>Z.fit*1.05; if(zoomed) lbFit(true); else if(onImg) lbZoomAt(Z.fit*3,x,y,true); else closeLb(); return; }
  if(now-lastTap<320){ lastTap=0; clearTimeout(lbUp.t); if(Z.s>Z.fit*1.05) lbFit(true); else lbZoomAt(Z.fit*3,x,y,true); return; }
  lastTap=now;
  lbUp.t=setTimeout(()=>{ if(!onImg&&Z.s<=Z.fit*1.01) closeLb(); },330); };
lbSt.addEventListener("pointerup",lbUp); lbSt.addEventListener("pointercancel",lbUp);
addEventListener("resize",()=>{ if(!lb.hidden) lbFit("keep"); });
addEventListener("keydown",e=>{ if(lb.hidden) return; const [cx,cy]=lbMid();
  if(e.key==="Escape") closeLb();
  else if(e.key==="+"||e.key==="=") lbZoomAt(Z.s*1.6,cx,cy,true);
  else if(e.key==="-"||e.key==="_") lbZoomAt(Z.s/1.6,cx,cy,true);
  else if(e.key==="0") lbFit(true);
  else if(e.key.startsWith("Arrow")&&Z.s>Z.fit*1.01){ e.preventDefault(); const d=80; Z.tx+=e.key==="ArrowLeft"?d:e.key==="ArrowRight"?-d:0; Z.ty+=e.key==="ArrowUp"?d:e.key==="ArrowDown"?-d:0; lbClamp(); lbSt.classList.add("anim"); lbApply(); } });
function sizeImgs(){
  const imgs=[...app.querySelectorAll("img")];
  imgs.forEach(i=>{ const d=DIM[i.getAttribute("src")]; if(d&&!i.hasAttribute("width")){ i.setAttribute("width",d[0]); i.setAttribute("height",d[1]); } });
  /* once the first screen is in, fetch the rest of this page quietly so scrolling never waits */
  const lazy=imgs.filter(i=>i.loading==="lazy");
  const go=()=>lazy.forEach((i,k)=>setTimeout(()=>{ i.loading="eager"; },k*60));
  const first=app.querySelector(".chero img,.hero>.brain");
  if(first&&!first.complete) first.addEventListener("load",()=>("requestIdleCallback" in window?requestIdleCallback(go,{timeout:1500}):setTimeout(go,400)),{once:true});
  else ("requestIdleCallback" in window?requestIdleCallback(go,{timeout:1500}):setTimeout(go,400));
}
/* warm the cache for a case study as soon as someone points at its card */
const warmed=new Set();
document.addEventListener("pointerover",e=>{ const a=e.target.closest&&e.target.closest("a.wk"); if(!a) return; const id=a.getAttribute("href").slice(1); if(warmed.has(id)||!byId[id]) return; warmed.add(id); const im=new Image(); im.decoding="async"; im.src=IMG(HERO(id)||byId[id].hero); },{passive:true});
let tocOff=null;
function tocSetup(){
  if(tocOff){ tocOff(); tocOff=null; }
  const toc=document.querySelector(".toc"); if(!toc) return;
  const links=[...toc.querySelectorAll("a[data-toc]")];
  const targets=links.map(a=>[a,document.getElementById(a.dataset.toc)]).filter(x=>x[1]);
  const bar=()=>navH()+(matchMedia("(max-width:1199px)").matches?toc.offsetHeight+16:24);
  links.forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=document.getElementById(a.dataset.toc); if(el) aim(el,reduce); });
  let raf=0;
  const update=()=>{ raf=0; const line=Math.min(innerHeight*0.32,260); let cur=null;
    for(const [a,el] of targets){ if(el.getBoundingClientRect().top-line<=0) cur=a; }
    links.forEach(a=>a.classList.toggle("on",a===cur));
    toc.querySelectorAll("li.grp").forEach(li=>li.classList.toggle("open",!!cur&&li.contains(cur)));
    if(cur&&matchMedia("(max-width:1199px)").matches){ const sc=toc.querySelector(":scope>ol"); let top=cur.closest("li"); while(top&&top.parentElement.closest("li")) top=top.parentElement.closest("li"); const l=(top||cur).offsetLeft-24; if(Math.abs(sc.scrollLeft-l)>40) sc.scrollTo({left:l,behavior:"smooth"}); }
  };
  const onScroll=()=>{ if(!raf) raf=requestAnimationFrame(update); };
  addEventListener("scroll",onScroll,{passive:true}); addEventListener("resize",onScroll);
  update();
  tocOff=()=>{ removeEventListener("scroll",onScroll); removeEventListener("resize",onScroll); };
}
function wire(){
  document.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();goTo(document.getElementById(a.dataset.jump))});
  document.querySelectorAll("[data-scrollto]").forEach(a=>a.onclick=e=>{
    const id=a.dataset.scrollto, link=[...app.querySelectorAll(`a[href="#${id}"]`)].find(x=>!x.closest(".hero")&&x.offsetParent!==null);
    if(!link) return;                                   /* not on this page: let the link open the case study */
    e.preventDefault();
    const card=link.closest(".feat,.wk,article")||link, off=navH()+Math.min(80,innerHeight*.08);
    const ping=()=>{ card.classList.remove("pinged"); void card.offsetWidth; card.classList.add("pinged"); setTimeout(()=>card.classList.remove("pinged"),2400); };
    if(lenis){ lenis.resize(); lenis.scrollTo(card,{offset:-off,force:true}); } else window.scrollTo({top:card.getBoundingClientRect().top+scrollY-off,behavior:reduce?"auto":"smooth"});
    setTimeout(ping,reduce?0:950);
  });
  document.querySelectorAll(".zoom").forEach(z=>z.onclick=()=>openLb(z.dataset.src,z.dataset.cap));
  document.querySelectorAll(".morebtn").forEach(b=>b.onclick=()=>{const tb=b.parentElement.querySelector(".more-rows"); const open=tb.hidden; tb.hidden=!open; b.setAttribute("aria-expanded",open); b.textContent=open?"Show fewer rows":`Show ${tb.rows.length} more rows`; if(lenis) lenis.resize();});
  
  reveal(); parallax(); tocSetup(); sizeImgs(); resumeCheck(); brainInit(); loopInit(); demoInit(); navState();
  document.querySelectorAll("[data-ext]").forEach(a=>{ const u=PROFILES[a.dataset.ext]; if(u){ a.href=u; a.target="_blank"; a.rel="noopener"; a.classList.remove("ph"); } else { a.classList.add("ph"); a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); a.title="Link coming soon"; } });
}

function render(h){
  const p=byId[h];
  if(h==="about"){
    current="about"; app.innerHTML=aboutPage(); nav.classList.remove("on-dark");
    document.title="About · Vivek Vikram Singh"; top0();
  }else if(p){
    current=p.id; app.innerHTML=casePage(p); nav.classList.remove("on-dark");
    document.title=p.name+" · Vivek Vikram Singh"; top0();
  }else{
    const was=current; current=null;
    if(!app.querySelector("#work")){ app.innerHTML=home(); }
    nav.classList.add("on-dark"); document.title="Vivek Vikram Singh";
    const t=h&&h!=="top"&&document.getElementById(h);
    if(lenis) lenis.resize();
    if(t) goTo(t, !!was); else if(was||!h) top0(); else if(lenis) lenis.scrollTo(0,{force:true}); else window.scrollTo({top:0,behavior:"smooth"});
  }
  wire();
}
function route(){
  const h=location.hash.slice(1);
  const isPage=x=>!!byId[x]||x==="about";
  const switching=(isPage(h)&&current!==h)||(!isPage(h)&&current);
  if(switching&&!reduce){ app.classList.add("fade"); setTimeout(()=>{render(h);requestAnimationFrame(()=>app.classList.remove("fade"))},160); }
  else render(h);
}
document.addEventListener("click",e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  const a=e.target.closest('a[href^="#"]'); if(!a||a.hasAttribute("data-jump")||a.hasAttribute("data-toc")) return;
  const h=a.getAttribute("href").slice(1)||"top";
  e.preventDefault();
  if(lenis) lenis.scrollTo(window.scrollY,{immediate:true,force:true});
  if(h==="contact"){ goTo(document.getElementById("contact")); return; }
  if(location.hash.slice(1)===h) route(); else location.hash=h;
});
document.getElementById("copy").onclick=()=>{const b=document.getElementById("copy"),m=document.getElementById("mail");
  const ok=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy email",1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(m);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected · press Ctrl+C"};
  try{navigator.clipboard.writeText(m.textContent).then(ok).catch(sel)}catch(e){sel()}};
navFill();
function resumeCheck(){ const b=document.querySelector("[data-resume]"); if(!b||b.dataset.checked) return; b.dataset.checked="1";
  fetch("resume.pdf",{method:"HEAD"}).then(r=>{ if(!r.ok) throw 0; }).catch(()=>{ b.setAttribute("href","#contact"); b.removeAttribute("target"); b.title="Resume available on request"; }); }
function setTheme(t){
  const dark=t==="dark"; document.documentElement.dataset.theme=dark?"dark":"light";
  const b=document.querySelector(".tg"); if(b){ b.setAttribute("aria-checked",dark); b.title=dark?"Switch to light mode":"Switch to dark mode"; }
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=dark?"#121212":"#EEEEEE";
}
setTheme(document.documentElement.dataset.theme);
document.querySelector(".tg").addEventListener("click",()=>{
  const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
  setTheme(next); try{localStorage.setItem("theme",next)}catch(e){}
});
addEventListener("hashchange",route);
render(location.hash.slice(1));
</script>
